<!doctype html>
<html lang="ru">
<head>
<link href="https://fonts.googleapis.com/css2?family=Yeseva+One&display=swap" rel="stylesheet">

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Пушкин. Стихотворения</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=Literata:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-base: #0d0b0a;
    --bg-1: #ffffff;
    --ink: #0a0a0a;
    --ink-soft: rgba(10, 10, 10, 0.62);
    --ink-mute: rgba(10, 10, 10, 0.42);
    --line: rgba(10, 10, 10, 0.10);
    --paper: #f7f3ea;
    --font-serif: 'Instrument Serif', 'Iowan Old Style', 'Times New Roman', Georgia, serif;
    --font-classic: 'Old Standard TT', 'Iowan Old Style', 'Times New Roman', Georgia, serif;
    --font-literata: 'Literata', 'Iowan Old Style', 'Times New Roman', Georgia, serif;
    --font-sans: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
  }

  * { box-sizing: border-box; cursor: default !important; }

  html, body,
  a, button, [role="button"], input, textarea, select,
  .case-scroll, .case-action {
    cursor: default !important;
  }

  html, body {
    margin: 0; height: 100%;
    background: var(--bg-base);
    overflow: hidden;
    font-family: var(--font-sans);
    color: var(--ink);
    font-feature-settings: 'cv02', 'cv03', 'cv04';
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
  }

  #app {
    position: relative;
    width: 100%;
    height: 100dvh;
    overflow: hidden;
    background:
      radial-gradient(
        ellipse 90% 85% at 50% 50%,
        #f8f2e6 0%,
        #f2e9d9 45%,
        #e4d6bf 75%,
        #c9b89e 100%
      );
  }
  #app::after {
    content: "";
    position: absolute; inset: 0;
    z-index: 3;
    pointer-events: none;
    background:
      radial-gradient(ellipse 92% 88% at 50% 50%,
        rgba(0,0,0,0) 60%,
        rgba(42,34,28,0.10) 82%,
        rgba(42,34,28,0.22) 100%);
  }

  #canvas-host {
    position: absolute; inset: 0; z-index: 2;
  }
  #canvas-host canvas {
    display: block;
    touch-action: none;
    cursor: default !important;
    will-change: transform;
  }

  #case-page {
    position: fixed; inset: 0; z-index: 40;
    background: var(--bg-1);
    transform: translateY(100%);
    will-change: transform;
    overflow: hidden;
  }

  .case-close {
    position: absolute;
    top: 22px; right: clamp(18px, 3vw, 34px);
    z-index: 60;
    width: 24px; height: 24px;
    padding: 0; margin: 0;
    background: none; border: none;
    outline: none;
    cursor: default;
    -webkit-tap-highlight-color: transparent;
  }
  .case-close::before,
  .case-close::after {
    content: "";
    position: absolute;
    top: 50%; left: 50%;
    width: 16px; height: 1px;
    background: var(--ink);
    opacity: .55;
    transition: opacity .6s cubic-bezier(.22,1,.36,1);
  }
  .case-close::before { transform: translate(-50%,-50%) rotate(45deg); }
  .case-close::after  { transform: translate(-50%,-50%) rotate(-45deg); }
  .case-close.is-faded::before,
  .case-close.is-faded::after { opacity: .08; }

  .case-close--exit {
    position: fixed;
    top: 22px; right: clamp(18px, 3vw, 34px);
    z-index: 70;
    color: var(--ink);
  }
  .case-close--exit::before,
  .case-close--exit::after {
    background: var(--ink);
  }

  .case-scroll {
    position: absolute; inset: 0; overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    scrollbar-width: none;
    cursor: default !important;
    background: var(--bg-1);
  }
  .case-scroll::-webkit-scrollbar { display: none; }
  .case-scroll.is-dragging { user-select: none; -webkit-user-select: none; }
  .case-scroll a, .case-scroll button { cursor: default !important; }

  .case-hero {
    position: relative;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: clamp(96px, 12vw, 140px) clamp(24px, 5vw, 72px) clamp(48px, 6vw, 84px);
    overflow: hidden;
    background: var(--bg-1);
  }
  .case-hero__media {
    position: absolute; inset: 0; z-index: 0;
    background: var(--paper) center/cover no-repeat;
    will-change: transform;
  }
  .case-hero__media::after {
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(180deg,
      rgba(255, 255, 255, 0.10) 0%,
      rgba(255, 255, 255, 0.22) 35%,
      rgba(255, 255, 255, 0.86) 72%,
      rgba(255, 255, 255, 1) 100%);
  }
  .case-hero__top, .case-hero__bottom {
    position: relative; z-index: 1;
    max-width: 1240px; width: 100%;
    margin: 0 auto;
  }
  .case-kicker {
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink-mute);
    margin: 0;
    font-weight: 500;
  }
  .case-title {
    margin: 0;
    font-family: var(--font-classic);
    font-size: clamp(64px, 13vw, 200px);
    line-height: 0.98;
    letter-spacing: -0.02em;
    font-weight: 400;
    color: var(--ink);
    overflow-wrap: break-word;
    word-break: normal;
    max-width: 100%;
  }
  .case-title span {
    display: inline-block;
    will-change: transform, opacity;
    transform-origin: 50% 100%;
  }
  .case-title__word { white-space: nowrap; }

  .case-meta {
    max-width: 1080px; margin: 0 auto;
    padding: clamp(48px, 7vw, 96px) clamp(24px, 4vw, 48px);
    display: grid;
    grid-template-columns: 0.8fr 1fr 1.6fr;
    gap: 0;
    border-bottom: 1px solid var(--line);
    background: var(--bg-1);
  }
  .case-meta > div {
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 0 clamp(16px, 2vw, 28px);
    border-left: 1px solid var(--line);
  }
  .case-meta > div:first-child {
    border-left: none;
    padding-left: 0;
  }
  .case-meta dt {
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink-mute);
    margin: 0;
    font-weight: 500;
  }
  .case-meta dd {
    margin: 0;
    font-family: var(--font-classic);
    font-size: clamp(18px, 1.6vw, 22px);
    line-height: 1.3;
    letter-spacing: -0.005em;
    color: var(--ink);
  }
  .case-meta > div:nth-child(3) dd {
    font-family: var(--font-sans);
    font-size: clamp(14px, 1.1vw, 16px);
    line-height: 1.6;
    color: var(--ink-soft);
    font-weight: 400;
  }

  .case-article {
    max-width: 760px;
    margin: 0 auto;
    padding: clamp(72px, 11vw, 150px) clamp(24px, 4vw, 40px) clamp(48px, 7vw, 90px);
    background: var(--bg-1);
  }

  .poem-wrap { position: relative; }
  .poem-wrap::before,
  .poem-wrap::after {
    content: "";
    display: block;
    width: 36px;
    height: 1px;
    background: var(--ink-mute);
    margin: 0;
    opacity: 0.55;
  }
  .poem-wrap::before { margin-bottom: clamp(40px, 6vw, 64px); }
  .poem-wrap::after  { margin-top: clamp(40px, 6vw, 64px); }

  .poem {
    font-family: var(--font-classic);
    font-size: clamp(24px, 2.4vw, 34px);
    line-height: 1.5;
    letter-spacing: -0.003em;
    color: var(--ink);
    text-align: left;
    margin: 0;
    max-width: none;
    font-weight: 400;
  }
  .poem p {
    margin: 0 0 1.4em;
    white-space: pre-line;
  }
  .poem p:last-child { margin-bottom: 0; }

  .case-actions {
    max-width: 760px;
    margin: 0 auto;
    padding: 0 clamp(24px, 4vw, 40px) clamp(56px, 8vw, 100px);
    display: flex;
    gap: 28px;
    align-items: center;
    flex-wrap: wrap;
    background: var(--bg-1);
  }
  .case-action {
    appearance: none; border: none; background: none; padding: 0; margin: 0;
    color: var(--ink-soft); font: inherit;
    font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; font-weight: 500;
    cursor: default;
    text-decoration: none;
  }
  .case-actions .dot {
    display: inline-block; width: 3px; height: 3px; border-radius: 50%;
    background: var(--ink-mute); vertical-align: middle;
  }

  .case-eval {
    max-width: 760px;
    margin: 0 auto;
    padding: clamp(56px, 8vw, 104px) clamp(24px, 4vw, 40px) clamp(96px, 12vw, 160px);
    border-top: 1px solid var(--line);
    background: var(--bg-1);
  }
  .case-eval__label {
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink-mute);
    font-weight: 500;
    margin: 0 0 clamp(28px, 4vw, 44px);
  }
  .case-eval__text {
    font-family: var(--font-literata);
    font-size: clamp(17px, 1.5vw, 21px);
    line-height: 1.65;
    letter-spacing: 0;
    color: var(--ink);
    margin: 0;
    font-weight: 400;
  }

  .case-page .reveal { opacity: 0; transform: translateY(24px); }

  @media (max-width: 720px) {
    .case-meta { grid-template-columns: 1fr; gap: 0; }
    .case-meta > div {
      border-left: none;
      padding: 20px 0 0;
      border-top: 1px solid var(--line);
    }
    .case-meta > div:first-child { border-top: none; padding-top: 0; }
    .poem { font-size: clamp(20px, 5vw, 26px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .case-page .reveal { opacity: 1 !important; transform: none !important; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="canvas-host"></div>
  <button class="case-close case-close--exit" id="case-exit" type="button" aria-label="На главную"></button>
  <div id="case-page">
    <button class="case-close case-close--inner" id="case-close" type="button" aria-label="Назад"></button>
    <div class="case-scroll" id="case-scroll">

      <section class="case-hero">
        <div class="case-hero__media" id="case-hero-media"></div>
        <div class="case-hero__top">
          <p class="case-kicker" id="case-kicker">А. С. Пушкин</p>
        </div>
        <div class="case-hero__bottom">
          <h1 class="case-title" id="case-title" aria-label=""></h1>
        </div>
      </section>

      <dl class="case-meta reveal">
        <div><dt>Год</dt><dd id="case-year">—</dd></div>
        <div><dt>Место</dt><dd id="case-role">—</dd></div>
        <div><dt>Обстановка</dt><dd id="case-discipline">—</dd></div>
      </dl>

      <article class="case-article" id="case-article"></article>

      <div class="case-actions">
        <button class="case-action" id="case-copy" type="button">Скопировать</button>
        <span class="dot" aria-hidden="true"></span>
        <a class="case-action" id="case-mail" href="#">Отправить</a>
      </div>

      <section class="case-eval" id="case-eval"></section>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://unpkg.com/delaunator@5.0.0/delaunator.min.js"></script>

<script>
(function () {
  if (typeof THREE === "undefined") {
    console.error("Three.js не загрузился.");
    return;
  }

  // ============ CONFIG ============
  // ИЗМЕНЕНО (починка начального вращения):
  //   fastSpinMult 8.5 -> 15 (компенсация убранного setInterval-буста)
  //   fastSpinRampDur 0.5 -> 0.7 (плавнее ramp)
  //   revealDelay 0.35 -> 0.5 (чуть дольше медленная фаза)
  const CONFIG = {
    radius: 220,
    planeSize: 130,
    dragSpeed: 0.001, wheelSpeed: 0.0002, friction: 0.94, smoothing: 0.11,
    autoSpeed: 0.001,
    logoOrbitRadius: 240, logoStartAngle: -90,
    revealDelay: 0.5, circleSpin: 0.55,
    fastSpinMult: 15, fastSpinRampDur: 1.7,
    collapseDuration: 0.75, collapseStagger: 0.03,
    stackGap: 1.4, explodeDelay: 0.1, explodeDuration: 0.85, explodeOvershoot: 0.12,
    exitCircleDur: 0.85,
    exitSpinDur: 0.55,
    exitVanishDur: 0.55,
    mobileDragMult: 2.2,
    mobileWheelMult: 2.0,
  };

  const mobile = () => (window.innerWidth <= 640);
  const getPlaneSize = () => (mobile() ? 78 : CONFIG.planeSize);
  const getRadius    = () => (mobile() ? 136 : CONFIG.radius);
  const getLogoOrbitRadius = () => (mobile() ? 150 : CONFIG.logoOrbitRadius);

  // ============ mini gsap ============
  const Eases = {
    power2inOut: (t) => (t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t+2, 2)/2),
    power2in:    (t) => t*t,
    power2out:   (t) => 1 - (1-t)*(1-t),
    power3out:   (t) => 1 - Math.pow(1-t, 3),
    power3in:    (t) => t*t*t,
    power4out:   (t) => 1 - Math.pow(1-t, 4),
  };
  const tweens = [];
  function tween(obj, props, opts) {
    opts = opts || {};
    if (opts.overwrite) {
      for (let i = tweens.length - 1; i >= 0; i--) if (tweens[i].obj === obj) tweens.splice(i, 1);
    }
    const from = {};
    for (const k in props) from[k] = (typeof obj[k] === "number") ? obj[k] : 0;
    tweens.push({
      obj, from, to: props,
      duration: opts.duration ?? 0.5,
      ease: opts.ease ?? Eases.power3out,
      delay: opts.delay ?? 0,
      onComplete: opts.onComplete ?? null,
      onUpdate: opts.onUpdate ?? null,
      elapsed: 0, done: false,
    });
  }
  function updateTweens(dt) {
    for (let i = tweens.length - 1; i >= 0; i--) {
      const tw = tweens[i];
      if (tw.done) { tweens.splice(i, 1); continue; }
      if (tw.delay > 0) { tw.delay -= dt; continue; }
      tw.elapsed += dt;
      const p = Math.min(1, tw.elapsed / tw.duration);
      const e = tw.ease(p);
      for (const k in tw.to) tw.obj[k] = tw.from[k] + (tw.to[k] - tw.from[k]) * e;
      if (tw.onUpdate) tw.onUpdate();
      if (p >= 1) { tw.done = true; tw.onComplete && tw.onComplete(); }
    }
  }

  // ============================================================
  // ПАЛИТРЫ
  // ============================================================
  const PALETTES = {
    civic_deep: { paper:"#e3b8ab", page:"#fbf2ed", hero:"radial-gradient(circle at 30% 20%, #f2d8ce 0%, #e0b0a0 55%, #c98a78 100%)", rule:"rgba(140,35,25,0.30)", meta:"rgba(120,45,35,0.58)", year:"rgba(120,45,35,0.42)", border:"rgba(140,35,25,0.16)" },
    civic_warm: { paper:"#ecd0c2", page:"#fcf4ee", hero:"radial-gradient(circle at 30% 20%, #f8e4d8 0%, #ebc8b8 55%, #d8a090 100%)", rule:"rgba(165,60,40,0.28)", meta:"rgba(140,55,40,0.55)", year:"rgba(140,55,40,0.40)", border:"rgba(165,60,40,0.14)" },
    civic_earth:{ paper:"#e5c6b0", page:"#fbf3ec", hero:"radial-gradient(circle at 30% 20%, #f5dfce 0%, #e8c8ae 55%, #cf9e7c 100%)", rule:"rgba(150,65,35,0.28)", meta:"rgba(125,60,35,0.55)", year:"rgba(125,60,35,0.40)", border:"rgba(150,65,35,0.14)" },
    civic_steel:{ paper:"#d8c4bd", page:"#f6f1ee", hero:"radial-gradient(circle at 30% 20%, #ecd9d1 0%, #dcc4ba 55%, #b8a09a 100%)", rule:"rgba(130,50,45,0.28)", meta:"rgba(105,55,50,0.55)", year:"rgba(105,55,50,0.40)", border:"rgba(130,50,45,0.14)" },
    civic_muted:{ paper:"#e0c5bd", page:"#f7f0ee", hero:"radial-gradient(circle at 30% 20%, #f0dcd4 0%, #e0c5bd 55%, #bda09a 100%)", rule:"rgba(140,55,50,0.26)", meta:"rgba(115,55,50,0.52)", year:"rgba(115,55,50,0.38)", border:"rgba(140,55,50,0.13)" },
    civic_cold: { paper:"#d6c8c8", page:"#f4f0f0", hero:"radial-gradient(circle at 30% 20%, #e8dcd8 0%, #d4c4c2 55%, #a89a9a 100%)", rule:"rgba(120,55,55,0.26)", meta:"rgba(95,55,55,0.52)", year:"rgba(95,55,55,0.38)", border:"rgba(120,55,55,0.13)" },
    civic_sea:  { paper:"#e0c9be", page:"#faf2ec", hero:"radial-gradient(circle at 30% 20%, #f0dcd1 0%, #e2c8bc 55%, #c4a59a 100%)", rule:"rgba(140,55,45,0.28)", meta:"rgba(110,55,45,0.55)", year:"rgba(110,55,45,0.40)", border:"rgba(140,55,45,0.14)" },
    civic_fire: { paper:"#e9bba4", page:"#fbf1e9", hero:"radial-gradient(circle at 30% 20%, #f7dccb 0%, #eab79a 55%, #cf7f58 100%)", rule:"rgba(175,65,25,0.30)", meta:"rgba(150,60,25,0.58)", year:"rgba(150,60,25,0.42)", border:"rgba(175,65,25,0.16)" },
    lyric_autumn:{ paper:"#ecdcb4", page:"#fbf7ea", hero:"radial-gradient(circle at 30% 20%, #f7ecc9 0%, #ead8a8 55%, #d0b478 100%)", rule:"rgba(135,100,45,0.28)", meta:"rgba(120,90,40,0.55)", year:"rgba(120,90,40,0.40)", border:"rgba(135,100,45,0.14)" },
    lyric_white:{ paper:"#f3f1eb", page:"#fbfbf8", hero:"radial-gradient(circle at 30% 20%, #fbfaf5 0%, #f1eee4 55%, #dcd8cb 100%)", rule:"rgba(100,110,130,0.26)", meta:"rgba(90,100,120,0.52)", year:"rgba(90,100,120,0.38)", border:"rgba(100,110,130,0.12)" },
    lyric_blue: { paper:"#d0d6de", page:"#f2f4f7", hero:"radial-gradient(circle at 30% 20%, #e0e5ec 0%, #ccd2dc 55%, #a8b0bc 100%)", rule:"rgba(70,90,120,0.26)", meta:"rgba(65,80,105,0.52)", year:"rgba(65,80,105,0.38)", border:"rgba(70,90,120,0.13)" },
    lyric_warm: { paper:"#eedcc6", page:"#fbf5ea", hero:"radial-gradient(circle at 30% 20%, #f8ead6 0%, #ead6bc 55%, #d2b690 100%)", rule:"rgba(140,105,55,0.26)", meta:"rgba(120,90,50,0.52)", year:"rgba(120,90,50,0.38)", border:"rgba(140,105,55,0.13)" },
    lyric_rose: { paper:"#f0dde0", page:"#fbf4f4", hero:"radial-gradient(circle at 30% 20%, #f8ebec 0%, #eedbdc 55%, #d4b8ba 100%)", rule:"rgba(140,80,90,0.26)", meta:"rgba(120,75,85,0.52)", year:"rgba(120,75,85,0.38)", border:"rgba(140,80,90,0.13)" },
    lyric_soft: { paper:"#f0e8da", page:"#fbf7ef", hero:"radial-gradient(circle at 30% 20%, #f8f2e5 0%, #ece2d0 55%, #d4c8ac 100%)", rule:"rgba(120,100,70,0.26)", meta:"rgba(105,90,60,0.52)", year:"rgba(105,90,60,0.38)", border:"rgba(120,100,70,0.13)" },
    lyric_brown:{ paper:"#d4bfa4", page:"#f6f1e8", hero:"radial-gradient(circle at 30% 20%, #e8d5ba 0%, #d4bfa0 55%, #a88e6a 100%)", rule:"rgba(100,75,45,0.30)", meta:"rgba(85,65,40,0.55)", year:"rgba(85,65,40,0.42)", border:"rgba(100,75,45,0.16)" },
    lyric_grey: { paper:"#dcd8d0", page:"#f6f4f1", hero:"radial-gradient(circle at 30% 20%, #ece8df 0%, #dad5ca 55%, #b8b2a6 100%)", rule:"rgba(95,90,80,0.26)", meta:"rgba(85,80,70,0.52)", year:"rgba(85,80,70,0.38)", border:"rgba(95,90,80,0.13)" },
  };

  const ITEMS = [
    { title: "Вольность",                 slug: "volnost",       year: "1817", palette: "civic_deep"  },
    { title: "К Чаадаеву",                slug: "k-chaadaevu",   year: "1818", palette: "civic_warm"  },
    { title: "Деревня",                   slug: "derevnya",      year: "1819", palette: "civic_earth" },
    { title: "Кинжал",                    slug: "kinzhal",       year: "1821", palette: "civic_steel" },
    { title: "Узник",                     slug: "uznik",         year: "1822", palette: "civic_muted" },
    { title: "В Сибирь",                  slug: "v-sibir",       year: "1827", palette: "civic_cold"  },
    { title: "Арион",                     slug: "arion",         year: "1827", palette: "civic_sea"   },
    { title: "Пророк",                    slug: "prorok",        year: "1826", palette: "civic_fire"  },
    { title: "Поэт",                      slug: "poet",          year: "1827", palette: "civic_deep"  },

  const CASES = {
    "volnost": { year: "1817", place: "Санкт-Петербург", situation: "После окончания Лицея, в кругу радикально настроенной дворянской молодёжи; влияние идей Просвещения и французской революции.", poem: `Беги, сокройся от очей,

    "k-chaadaevu": { year: "1818", place: "Санкт-Петербург", situation: "Кружок «Зелёная лампа», дружба с П. Я. Чаадаевым, ожидание реформ Александра I, декабристские настроения.", poem: `Любви, надежды, тихой славы

    "derevnya": { year: "1819", place: "Михайловское", situation: "Первый приезд в имение; размышления о крепостном праве.", poem: `Приветствую тебя, пустынный уголок,

Где льется дней моих невидимый поток

Роскошные пиры, забавы, заблужденья

Не видя слез, не внемля стона,

    "kinzhal": { year: "1821", place: "Кишинёв", situation: "Южная ссылка; общение с декабристами, тираноборческие настроения.", poem: `Лемносский бог тебя сковал

    "uznik": { year: "1822", place: "Кишинёв", situation: "Южная ссылка; чувство несвободы, тоска по воле.", poem: `Сижу за решеткой в темнице сырой.

    "v-sibir": { year: "1827", place: "Москва", situation: "После возвращения из ссылки; передано декабристам через А. Г. Муравьёву.", poem: `Во глубине сибирских руд

    "arion": { year: "1827", place: "Москва", situation: "Годовщина казни декабристов; аллегория их судьбы.", poem: `Нас было много на челне;

    "prorok": { year: "1826", place: "Михайловское", situation: "Михайловская ссылка; накануне возвращения, тема высокого призвания поэта.", poem: `Духовной жаждою томим,
В пустыне мрачной я влачился, —
И шестикрылый серафим
На перепутье мне явился.
Перстами легкими как сон
Моих зениц коснулся он:
Отверзлись вещие зеницы,

Моих ушей коснулся он, —

Как труп в пустыне я лежал,

    "poet": { year: "1827", place: "Москва", situation: "Размышления о независимости поэта от «толпы», о высоком призвании.", poem: `Пока не требует поэта

    "poetu": { year: "1830", place: "Болдино", situation: "Болдинская осень; утверждение свободы художника.", poem: `Поэт! не дорожи любовию народной.
Восторженных похвал пройдет минутный шум;

    "osen": { year: "1833", place: "Болдино", situation: "Вторая Болдинская осень; размышления о природе, творчестве, увядании.", poem: `Октябрь уж наступил — уж роща отряхает
Последние листы с нагих своих ветвей;
Дохнул осенний хлад — дорога промерзает.
Журча еще бежит за мельницу ручей,

    "zimnee-utro": { year: "1829", place: "Тверская губерния", situation: "Поездка в имение Вульфов; светлое настроение, любовь к природе.", poem: `Мороз и солнце; день чудесный!
Еще ты дремлешь, друг прелестный —
Пора, красавица, проснись:
Открой сомкнуты негой взоры
Навстречу северной Авроры,

Вечор, ты помнишь, вьюга злилась,

Под голубыми небесами

Блестя на солнце, снег лежит;

Кобылку бурую запречь?

    "zimniy-vecher": { year: "1825", place: "Михайловское", situation: "Михайловская ссылка; одиночество с няней Ариной Родионовной.", poem: `Буря мглою небо кроет,
Вихри снежные крутя;
То, как зверь, она завоет,
То заплачет, как дитя,

Вдруг соломой зашумит,

Наша ветхая лачужка

Выпьем, добрая подружка

Спой мне песню, как синица
Тихо за морем жила;

    "nyane": { year: "1826", place: "Михайловское", situation: "Михайловская ссылка; разлука с няней, привязанность к ней.", poem: `Подруга дней моих суровых,
Голубка дряхлая моя!
Одна в глуши лесов сосновых
Давно, давно ты ждешь меня.
Ты под окном своей светлицы
Горюешь, будто на часах,

Глядишь в забытые вороты

    "ya-pomnyu": { year: "1825", place: "Михайловское", situation: "Михайловская ссылка; встреча с А. П. Керн в Тригорском.", poem: `Я помню чудное мгновенье:
Передо мной явилась ты,
Как мимолетное виденье,
Как гений чистой красоты.

В томленьях грусти безнадежной,
В тревогах шумной суеты,
Звучал мне долго голос нежный
И снились милые черты.

Шли годы. Бурь порыв мятежный
Рассеял прежние мечты,
И я забыл твой голос нежный,
Твои небесные черты.

В глуши, во мраке заточенья
Тянулись тихо дни мои
Без божества, без вдохновенья,
Без слез, без жизни, без любви.

Душе настало пробужденье:
И вот опять явилась ты,

И сердце бьется в упоенье,
И для него воскресли вновь
И божество, и вдохновенье,
И жизнь, и слезы, и любовь.`, assessment: "Это стихотворение — эталон любовной лирики, в которой видится проявление нравственного здоровья и гармонического развития человека." },
    "vas-lyubil": { year: "1829", place: "Санкт-Петербург", situation: "Зрелая лирика; прощание с любовью, благородство чувства.", poem: `Я вас любил: любовь еще, быть может,
В душе моей угасла не совсем;
Но пусть она вас больше не тревожит;
Я не хочу печалить вас ничем.

    "besy": { year: "1830", place: "Болдино", situation: "Болдинская осень; тревожные предчувствия, народные поверья.", poem: `Мчатся тучи, вьются тучи;
Невидимкою луна
Освещает снег летучий;
Мутно небо, ночь мутна.
Еду, еду в чистом поле;

Страшно, страшно поневоле
Средь неведомых равнин!`, assessment: "«Бесы» интересны с точки зрения народности и фантастики, но реалистическая основа пушкинской лирики остаётся здесь главной." },
    "elegiya": { year: "1830", place: "Болдино", situation: "Болдинская осень; итоговое размышление о жизни.", poem: `Безумных лет угасшее веселье
Мне тяжело, как смутное похмелье.

Мой путь уныл. Сулит мне труд и горе
Грядущего волнуемое море.

Но не хочу, о други, умирать;
Я жить хочу, чтоб мыслить и страдать;
И ведаю, мне будут наслажденья
Меж горестей, забот и треволненья:
Порой опять гармонией упьюсь,
Над вымыслом слезами обольюсь,
И может быть — на мой закат печальный
Блеснет любовь улыбкою прощальной.`, assessment: "«Элегия» — философское принятие трагизма бытия без уныния, что говорит о нравственном здоровье поэта." },
  };

  // ============ Shaders ============
  const tileVert = `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `;

  const tileFrag = `
    uniform sampler2D uTex;
    uniform float uHasTex;
    uniform vec3 uColor;
    varying vec2 vUv;

    void main() {
      vec4 col = texture2D(uTex, vUv);
      vec3 base = mix(uColor, col.rgb, uHasTex);
      gl_FragColor = vec4(base, 1.0);
    }
  `;

  function fibonacciSphere(i, n) {
    const r = 2 / n;
    const y = i * r - 1 + r / 2;
    const rad = Math.sqrt(Math.max(0, 1 - y * y));
    const theta = Math.PI * (3 - Math.sqrt(5)) * i;
    return new THREE.Vector3(Math.cos(theta) * rad, y, Math.sin(theta) * rad);
  }

  const host = document.getElementById("canvas-host");

  let W = host.clientWidth || window.innerWidth;
  let H = host.clientHeight || window.innerHeight;

  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: true,
      powerPreference: "high-performance",
      preserveDrawingBuffer: true,
    });
  } catch (err) {
    console.error("WebGL не создался: " + err.message);
    return;
  }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(W, H, false);
  renderer.domElement.style.width = "100%";
  renderer.domElement.style.height = "100%";
  renderer.domElement.style.cursor = "default";
  host.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = null;
  const camera = new THREE.PerspectiveCamera(60, W / H, 0.1, 1000);
  camera.position.z = 12;

  const group = new THREE.Group();
  scene.add(group);

  const pxToWorld = (px) =>
    px * ((2 * camera.position.z * Math.tan((camera.fov * Math.PI) / 360)) / H);

  const N = Math.max(ITEMS.length, 18);
  const planeGeom = new THREE.PlaneGeometry(1, 1);
  const tiles = [];
  const maxAniso = renderer.capabilities.getMaxAnisotropy();

  function computeBaseScale(tile) {
    const t = pxToWorld(getPlaneSize());
    const a = tile.aspect || 1;
    if (a >= 1) tile.baseScale.set(t, t / a, 1);
    else tile.baseScale.set(t * a, t, 1);
  }

  function wrapTextLines(ctx, text, maxWidth) {
    const words = text.split(" ");
    const lines = [];
    let line = "";
    for (const word of words) {
      const test = line ? line + " " + word : word;
      if (ctx.measureText(test).width > maxWidth && line) {
        lines.push(line);
        line = word;
      } else {
        line = test;
      }
    }
    if (line) lines.push(line);
    return lines;
  }

  function drawTileCanvas(data) {
    const pal = PALETTES[data.palette] || PALETTES.lyric_soft;

    const w = 800, h = 1000;
    const canvas = document.createElement("canvas");
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext("2d");

    ctx.fillStyle = pal.paper;
    ctx.fillRect(0, 0, w, h);

    ctx.strokeStyle = pal.border;
    ctx.lineWidth = 6;
    ctx.strokeRect(36, 36, w - 72, h - 72);

    const title = data.title || "";
    let fontSize;
    if (title.length <= 8) fontSize = 100;
    else if (title.length <= 13) fontSize = 78;
    else if (title.length <= 19) fontSize = 62;
    else fontSize = 48;

    ctx.fillStyle = "#1a1409";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = `400 ${fontSize}px "Yeseva One", "Times New Roman", Georgia, serif`;

    const maxWidth = w - 160;
    const lineHeight = fontSize * 1.08;
    const lines = wrapTextLines(ctx, title, maxWidth);
    const totalH = lines.length * lineHeight;
    const startY = h / 2 - totalH / 2 + lineHeight / 2 - 30;
    lines.forEach((l, i) => ctx.fillText(l, w / 2, startY + i * lineHeight));

    const ruleY = h / 2 + totalH / 2 + 30;
    ctx.strokeStyle = pal.rule;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(w / 2 - 30, ruleY);
    ctx.lineTo(w / 2 + 30, ruleY);
    ctx.stroke();

    if (data.year) {
      ctx.fillStyle = pal.year;
      ctx.font = '500 30px "Yeseva One", system-ui, sans-serif';
      ctx.fillText(data.year, w / 2, h - 80);
    }

    return canvas;
  }

  function setTileTexture(tile) {
    const canvas = drawTileCanvas(tile.data);
    const tex = new THREE.CanvasTexture(canvas);
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.minFilter = THREE.LinearMipmapLinearFilter;
    tex.magFilter = THREE.LinearFilter;
    tex.anisotropy = maxAniso;
    const old = tile.mat.uniforms.uTex.value;
    if (old && old.dispose) old.dispose();
    tile.mat.uniforms.uTex.value = tex;
    tile.mat.uniforms.uHasTex.value = 1;
    tile.aspect = 800 / 1000;
    computeBaseScale(tile);
  }

  for (let i = 0; i < N; i++) {
    const data = ITEMS[i] || { title: "Без названия", slug: "item-" + i, year: "", palette: "lyric_soft" };

    const color = new THREE.Color().setHSL((i * 0.11) % 1, 0.25, 0.85);

    const mat = new THREE.ShaderMaterial({
      uniforms: {
        uTex:    { value: null },
        uHasTex: { value: 0 },
        uColor:  { value: color },
      },
      vertexShader: tileVert,
      fragmentShader: tileFrag,
      transparent: false,
      side: THREE.DoubleSide,
      depthWrite: true,
      depthTest: true,
    });

    const mesh = new THREE.Mesh(planeGeom, mat);
    mesh.renderOrder = i;
    group.add(mesh);

    const tile = {
      mesh, mat, index: i, data, aspect: 0.8,
      basePos: new THREE.Vector3(), baseScale: new THREE.Vector3(1, 1, 1),
      orderly: fibonacciSphere(i, N),
      explode: 0,
      expStartPos: null, expStartScale: null,
    };

    setTileTexture(tile);
    tiles.push(tile);
  }

  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(() => {
      tiles.forEach((t) => setTileTexture(t));
    });
  }

  function layoutBasePositions() {
    tiles.forEach((t) => {
      const v = t.orderly.clone().normalize();
      const r = pxToWorld(getRadius());
      t.basePos.set(v.x * r, v.y * r, v.z * r);
      computeBaseScale(t);
    });
  }

  // ============ state ============
  let isLoading = true;
  let isCollapsing = false;
  let exploded = false;
  let autoSpin = false;
  let userInteracted = false;
  let currentQuat = new THREE.Quaternion();
  let fastRamp = { v: 0 };
  let exitAnimating = false;
  let exitFaded = false;
  const spinAxis = new THREE.Vector3(0, 1, 0);

  // ============ preloader ============
  let spinAngle = 0;
  function placePreloaderTiles() {
    if (isCollapsing) return;
    const radius = pxToWorld(getLogoOrbitRadius());
    for (let i = 0; i < 10 && i < tiles.length; i++) {
      const t = tiles[i];
      const angle = ((CONFIG.logoStartAngle + 36 * i) * Math.PI) / 180 + spinAngle;
      t.mesh.position.set(Math.cos(angle) * radius, Math.sin(angle) * radius, i * 0.015);
      const s = pxToWorld(getPlaneSize() * 0.8);
      const a = t.aspect || 1;
      if (a >= 1) t.mesh.scale.set(s, s / a, 1);
      else t.mesh.scale.set(s * a, s, 1);
    }
    for (let i = 10; i < tiles.length; i++) {
      tiles[i].mesh.position.set(0, 0, 0);
      tiles[i].mesh.scale.set(0.001, 0.001, 1);
    }
  }

  layoutBasePositions();

  // ИЗМЕНЕНО: ease power2in -> power2inOut, чтобы ramp входил и выходил мягко
  function startFastSpin() {
    tween(fastRamp, { v: 1 }, {
      duration: CONFIG.fastSpinRampDur,
      ease: Eases.power2inOut,
      overwrite: true,
    });
  }

  function startCollapseThenExplode() {
    isCollapsing = true;
const stackH = pxToWorld(CONFIG.stackGap);

    tiles.forEach((t, i) => {
      const fromPos = t.mesh.position.clone();
      const toPos = new THREE.Vector3(0, 0, i * stackH);
      const state = { p: 0 };
      tween(state, { p: 1 }, {
        duration: CONFIG.collapseDuration,
        ease: Eases.power2inOut,
        delay: i * CONFIG.collapseStagger,
        onUpdate: () => {
          t.mesh.position.lerpVectors(fromPos, toPos, state.p);
        },
      });
    });

    const totalMs =
      (CONFIG.collapseDuration + (tiles.length - 1) * CONFIG.collapseStagger) * 1000 +
      CONFIG.explodeDelay * 1000;

    setTimeout(() => {
      startExplode();
    }, totalMs);
  }

  function startExplode() {
    if (exploded) return;
    exploded = true;
    autoSpin = true;

    tiles.forEach((t) => {
      t.expStartPos = t.mesh.position.clone();
      t.expStartScale = { x: t.mesh.scale.x, y: t.mesh.scale.y };
      t.explode = 0;
      const a = t.aspect || 1;
      const s = pxToWorld(getPlaneSize());
      const targetSX = a >= 1 ? s : s * a;
      const targetSY = a >= 1 ? s / a : s;
      t.mesh.scale.set(targetSX, targetSY, 1);
    });

    let done = 0;
    tiles.forEach((t) => {
      tween(t, { explode: 1 }, {
        duration: CONFIG.explodeDuration, ease: Eases.power3out,
        onComplete: () => { if (++done === tiles.length) finalizeIdle(); },
      });
    });
  }

  function finalizeIdle() {
    isLoading = false;
    isCollapsing = false;
    exploded = false;
    tiles.forEach((t) => {
      t.mesh.position.copy(t.basePos);
      computeBaseScale(t);
    });
  }

  // ИЗМЕНЕНО: убран setInterval-буст, единственный источник скорости — RAF-цикл по dt
  setTimeout(() => {
    startFastSpin();
    setTimeout(() => {
      startCollapseThenExplode();
    }, CONFIG.fastSpinRampDur * 1000);
  }, CONFIG.revealDelay * 1000);

  // ============ input ============
  let vel = 0, velX = 0, acc = 0, accX = 0, prev = 0, prevX = 0;
  let pointerDown = false;
  let lastPx = 0, lastPy = 0;

  function markInteracted() {
    if (!userInteracted) userInteracted = true;
  }

  renderer.domElement.addEventListener("wheel", (e) => {
    if (isLoading || caseOpen || exitAnimating) return;
    e.preventDefault();
    markInteracted();
    const wm = mobile() ? CONFIG.mobileWheelMult : 1;
    vel += e.deltaY * CONFIG.wheelSpeed * wm;
  }, { passive: false });

  renderer.domElement.addEventListener("pointerdown", (e) => {
    if (isLoading || caseOpen || exitAnimating) return;
    pointerDown = true;
    lastPx = e.clientX; lastPy = e.clientY;
    markInteracted();
  });

  window.addEventListener("pointermove", (e) => {
    if (!pointerDown || isLoading || caseOpen || exitAnimating) return;
    const dx = e.clientX - lastPx;
    const dy = e.clientY - lastPy;
    lastPx = e.clientX; lastPy = e.clientY;
    const dm = mobile() ? CONFIG.mobileDragMult : 1;
    vel += dx * CONFIG.dragSpeed * dm;
    velX += dy * CONFIG.dragSpeed * dm;
  });

  window.addEventListener("pointerup", () => {
    pointerDown = false;
  });

  // ============ raycast ============
  const raycaster = new THREE.Raycaster();
  const ndc = new THREE.Vector2();
  const tileMeshes = tiles.map((t) => t.mesh);

  function pick(cx, cy) {
    const rect = renderer.domElement.getBoundingClientRect();
    ndc.x = ((cx - rect.left) / rect.width) * 2 - 1;
    ndc.y = -((cy - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(ndc, camera);
    const hits = raycaster.intersectObjects(tileMeshes, false);
    return hits.length ? tiles.find((t) => t.mesh === hits[0].object) : null;
  }

  const TAP_MAX_MOVE = 8;
  const TAP_MAX_TIME = 300;

  function tryOpenAt(cx, cy) {
    if (isLoading || caseOpen || exitAnimating) return;
    const t = pick(cx, cy);
    if (t && t.data.slug) openCase(t.data.slug);
  }

  renderer.domElement.addEventListener("dblclick", (e) => {
    if (isLoading || caseOpen || exitAnimating) return;
    tryOpenAt(e.clientX, e.clientY);
  });

  let tapX = 0, tapY = 0, tapT = 0, tapCancelled = false;

  renderer.domElement.addEventListener("pointerdown", (e) => {
    if (e.pointerType === "mouse") return;
    if (isLoading || caseOpen || exitAnimating) return;
    tapX = e.clientX;
    tapY = e.clientY;
    tapT = performance.now();
    tapCancelled = false;
  });

  renderer.domElement.addEventListener("pointermove", (e) => {
    if (e.pointerType === "mouse") return;
    if (tapCancelled) return;
    const dx = e.clientX - tapX;
    const dy = e.clientY - tapY;
    if (dx * dx + dy * dy > TAP_MAX_MOVE * TAP_MAX_MOVE) {
      tapCancelled = true;
    }
  });

  renderer.domElement.addEventListener("pointerup", (e) => {
    if (e.pointerType === "mouse") return;
    if (isLoading || caseOpen || exitAnimating) return;
    if (tapCancelled) return;
    if (performance.now() - tapT > TAP_MAX_TIME) return;
    tryOpenAt(e.clientX, e.clientY);
  });

  renderer.domElement.addEventListener("pointercancel", () => {
    tapCancelled = true;
  });

  // ============ resize ============
  function resize() {
    W = host.clientWidth || window.innerWidth;
    H = host.clientHeight || window.innerHeight;
    if (!W || !H) return;
    camera.aspect = W / H;
    camera.updateProjectionMatrix();
    renderer.setSize(W, H, false);
    layoutBasePositions();
  }
  resize();
  new ResizeObserver(resize).observe(host);

  // ============================================================
  // CASE PAGE
  // ============================================================
  const casePage    = document.getElementById("case-page");
  const caseScroll  = document.getElementById("case-scroll");
  const caseHeroMedia = document.getElementById("case-hero-media");
  const caseTitleEl = document.getElementById("case-title");
  const caseClose   = document.getElementById("case-close");
  const caseExit    = document.getElementById("case-exit");
  const caseArticle = document.getElementById("case-article");
  const caseCopyBtn = document.getElementById("case-copy");
  const caseMail    = document.getElementById("case-mail");
  const caseEval    = document.getElementById("case-eval");

  let caseOpen = false;
  let currentCaseSlug = null;
  let caseIO = null;

  function findItem(slug) {
    return ITEMS.find((it) => it.slug === slug) || null;
  }

  function populateCase(slug) {
    const data = CASES[slug];
    const item = findItem(slug);
    if (!data || !item) return null;
    currentCaseSlug = slug;

    caseScroll.scrollTop = 0;
    caseClose.classList.remove("is-faded");

    const pal = PALETTES[item.palette] || PALETTES.lyric_soft;

    casePage.style.setProperty("--bg-1", pal.page || "#ffffff");

    document.getElementById("case-kicker").textContent = "А. С. Пушкин";
    document.getElementById("case-year").textContent = data.year;
    document.getElementById("case-role").textContent = data.place;
    document.getElementById("case-discipline").textContent = data.situation;

    caseHeroMedia.style.backgroundImage = "none";
    caseHeroMedia.style.background = pal.hero;
    caseHeroMedia.style.filter = "none";

    caseTitleEl.textContent = "";
    caseTitleEl.setAttribute("aria-label", item.title);
    const len = item.title.length;
    let fs;
    if (len <= 8) fs = "clamp(64px, 13vw, 200px)";
    else if (len <= 13) fs = "clamp(48px, 10vw, 150px)";
    else if (len <= 19) fs = "clamp(38px, 7.5vw, 110px)";
    else fs = "clamp(30px, 5.4vw, 78px)";
    caseTitleEl.style.fontSize = fs;

    const letters = [];
    const words = item.title.split(" ");
    words.forEach((word, wi) => {
      const wordSpan = document.createElement("span");
      wordSpan.className = "case-title__word";
      word.split("").forEach((ch) => {
        const s = document.createElement("span");
        s.textContent = ch;
        s.style.opacity = "0";
        s.style.transform = "translateY(0.8em) rotate(3deg)";
        s.setAttribute("aria-hidden", "true");
        wordSpan.appendChild(s);
        letters.push(s);
      });
      caseTitleEl.appendChild(wordSpan);
      if (wi < words.length - 1) {
        caseTitleEl.appendChild(document.createTextNode(" "));
      }
    });

    caseArticle.innerHTML = "";
    const wrap = document.createElement("div");
    wrap.className = "poem-wrap reveal";
    const poem = document.createElement("div");
    poem.className = "poem";
    data.poem.split(/\n\s*\n/).forEach((stanza) => {
      const txt = stanza.trim();
      if (!txt) return;
      const p = document.createElement("p");
      p.textContent = txt;
      poem.appendChild(p);
    });
    wrap.appendChild(poem);
    caseArticle.appendChild(wrap);

    caseEval.innerHTML = "";
    const label = document.createElement("p");
    label.className = "case-eval__label reveal";
    label.textContent = "Комментарий";
    const text = document.createElement("p");
    text.className = "case-eval__text reveal";
    text.textContent = data.assessment;
    caseEval.appendChild(label);
    caseEval.appendChild(text);

    document.querySelectorAll("#case-page .reveal").forEach((el) => {
      el.dataset.revealed = "";
      el.style.opacity = "0";
      el.style.transform = "translateY(24px)";
    });

    return letters;
  }

  function animateCaseLetters(letters, baseDelay) {
    letters.forEach((s, i) => {
      const ls = { o: 0, y: 0.8, r: 3 };
      tween(ls, { o: 1, y: 0, r: 0 }, {
        duration: 0.85,
        ease: Eases.power4out,
        delay: (baseDelay || 0) + 0.035 * i,
        onUpdate: () => {
          s.style.opacity = ls.o.toFixed(3);
          s.style.transform = `translateY(${ls.y.toFixed(3)}em) rotate(${ls.r.toFixed(3)}deg)`;
        },
      });
    });
  }

  function setupCaseReveals() {
    if (caseIO) caseIO.disconnect();
    caseIO = new IntersectionObserver((entries) => {
      entries.forEach((en) => {
        if (en.isIntersecting) {
          revealCaseEl(en.target);
          caseIO.unobserve(en.target);
        }
      });
    }, { root: caseScroll, rootMargin: "0px 0px -10% 0px", threshold: 0.05 });

    document.querySelectorAll("#case-page .reveal").forEach((el) => {
      if (!el.dataset.revealed) caseIO.observe(el);
    });
  }

  function revealCaseEl(el) {
    if (el.dataset.revealed === "1") return;
    el.dataset.revealed = "1";
    const st = { o: 0, y: 24 };
    tween(st, { o: 1, y: 0 }, {
      duration: 0.85, ease: Eases.power3out,
      onUpdate: () => {
        el.style.opacity = st.o.toFixed(3);
        el.style.transform = `translateY(${st.y.toFixed(2)}px)`;
      },
    });
  }

  function openCase(slug) {
    if (caseOpen && currentCaseSlug === slug) return;
    const letters = populateCase(slug);
    if (!letters) return;

    caseExit.style.display = "none";

    if (!caseOpen) {
      caseOpen = true;
      casePage.style.transform = "translateY(100%)";
      const st = { t: 100 };
      tween(st, { t: 0 }, {
        duration: 0.95, ease: Eases.power4out,
        onUpdate: () => {
          casePage.style.transform = `translateY(${st.t.toFixed(3)}%)`;
        },
      });
      animateCaseLetters(letters, 0.45);
    }

    setupCaseReveals();
  }

  function closeCase() {
    if (!caseOpen) return;
    const st = { t: 0 };
    tween(st, { t: 100 }, {
      duration: 0.75, ease: Eases.power3out,
      onUpdate: () => {
        casePage.style.transform = `translateY(${st.t.toFixed(3)}%)`;
      },
      onComplete: () => {
        caseOpen = false;
        casePage.style.opacity = "1";
        renderer.render(scene, camera);
        caseExit.style.display = "";
      },
    });
  }

  caseClose.addEventListener("click", closeCase);

  window.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && caseOpen) closeCase();
  });

  caseScroll.addEventListener("scroll", () => {
    if (caseScroll.scrollTop > 40) caseClose.classList.add("is-faded");
    else caseClose.classList.remove("is-faded");
  }, { passive: true });

  function getArticleText() {
    const parts = [];
    const h1 = caseTitleEl.getAttribute("aria-label");
    if (h1) parts.push(h1 + "\n");
    const year = document.getElementById("case-year").textContent;
    if (year) parts.push("Год: " + year);
    const place = document.getElementById("case-role").textContent;
    if (place) parts.push("Место: " + place);
    const situation = document.getElementById("case-discipline").textContent;
    if (situation) parts.push("Обстановка: " + situation);
    parts.push("");

    const poemEl = caseArticle.querySelector(".poem");
    if (poemEl) {
      poemEl.querySelectorAll("p").forEach((p) => parts.push(p.textContent + "\n"));
    }

    const evalText = document.querySelector(".case-eval__text");
    if (evalText) parts.push("\n" + evalText.textContent);

    return parts.join("\n").trim();
  }

  async function copyArticleText() {
    const text = getArticleText();
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
      } else {
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
      }
    } catch (err) {}
  }

  function updateMailLink() {
    const title = caseTitleEl.getAttribute("aria-label") || "Стихотворение";
    const body = getArticleText().slice(0, 1800);
    const subject = encodeURIComponent("А. С. Пушкин: " + title);
    const bodyEnc = encodeURIComponent(body);
    caseMail.href = `mailto:?subject=${subject}&body=${bodyEnc}`;
  }

  caseCopyBtn.addEventListener("click", copyArticleText);
  caseMail.addEventListener("click", () => setTimeout(updateMailLink, 0));

  const caseDrag = {
    active: false, pointerId: null, startY: 0, startScroll: 0, moved: false,
  };
  let suppressCaseClick = false;

  function isInteractive(el) {
    if (!el || !el.closest) return false;
    return !!el.closest("a, button, input, textarea, select, [contenteditable], [data-no-drag]");
  }

  caseScroll.addEventListener("pointerdown", (e) => {
    if (e.pointerType === "touch") return;
    if (e.pointerType === "mouse" && e.button !== 0) return;
    if (isInteractive(e.target)) return;
    suppressCaseClick = false;
    caseDrag.active = true;
    caseDrag.pointerId = e.pointerId;
    caseDrag.startY = e.clientY;
    caseDrag.startScroll = caseScroll.scrollTop;
    caseDrag.moved = false;
  });

  window.addEventListener("pointermove", (e) => {
    if (!caseDrag.active || e.pointerId !== caseDrag.pointerId) return;
    const dy = e.clientY - caseDrag.startY;
    if (!caseDrag.moved && Math.abs(dy) > 4) {
      caseDrag.moved = true;
      caseScroll.classList.add("is-dragging");
    }
    if (caseDrag.moved) {
      caseScroll.scrollTop = caseDrag.startScroll - dy;
      e.preventDefault();
    }
  }, { passive: false });

  function endCaseDrag(e) {
    if (!caseDrag.active) return;
    if (e && e.pointerId != null && e.pointerId !== caseDrag.pointerId) return;
    if (caseDrag.moved) suppressCaseClick = true;
    caseDrag.active = false;
    caseDrag.pointerId = null;
    caseDrag.moved = false;
    caseScroll.classList.remove("is-dragging");
  }

  window.addEventListener("pointerup", endCaseDrag);
  window.addEventListener("pointercancel", endCaseDrag);

  caseScroll.addEventListener("click", (e) => {
    if (suppressCaseClick) {
      e.preventDefault();
      e.stopPropagation();
      suppressCaseClick = false;
    }
  }, true);

  // ============================================================
  // SHATTER SYSTEM
  // ============================================================
  const IS_MOBILE_S = window.matchMedia("(pointer: coarse)").matches || window.innerWidth < 768;
  const SHATTER_TIME_SCALE  = IS_MOBILE_S ? 2.1 : 1.0;
  const SHATTER_DELAY_SCALE = IS_MOBILE_S ? 1.8 : 1.0;
  const SHATTER_MAX_WAIT    = IS_MOBILE_S ? 6000 : 3500;

  const TWO_PI_S = 2 * Math.PI;
  let sVW = window.innerWidth;
  let sVH = window.innerHeight;
  let sCameraStart = 3.5 * sVH;

  let sScene, sCamera, sRenderer, sGroup;
  const sClickPos = [sVW / 2, sVH / 2];
  let sVertices = [];
  let sIndices = [];
  let sActive = [];
  let sBusy = false;
  let sBgColor = "#f8f2e6";

  function sRandom(a, b) { return a + (b - a) * Math.random(); }
  function sClamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function sEaseIn(t) { return t * t * t; }
  function sDepth() { return Math.floor(500 * Math.random()) + 100; }

  function initShatterRenderer() {
    sScene = new THREE.Scene();
    sScene.background = null;

    const fov = 2 * Math.atan(sVH / (2 * sCameraStart)) * (180 / Math.PI);
    sCamera = new THREE.PerspectiveCamera(fov, sVW / sVH, 1, 20000);
    sCamera.position.set(0, 0, sCameraStart);
    sScene.add(sCamera);

    const light = new THREE.PointLight(0xffffff, 1);
    sCamera.add(light);

    sGroup = new THREE.Group();
    sGroup.position.set(-0.5 * sVW, -0.5 * sVH, 0);
    sScene.add(sGroup);

    sRenderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    sRenderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    sRenderer.setSize(sVW, sVH);
    sRenderer.setClearColor(0x000000, 0);
    sRenderer.domElement.style.position = "fixed";
    sRenderer.domElement.style.top = "0";
    sRenderer.domElement.style.left = "0";
    sRenderer.domElement.style.width = "100%";
    sRenderer.domElement.style.height = "100%";
    sRenderer.domElement.style.zIndex = "999";
    sRenderer.domElement.style.display = "none";
    sRenderer.domElement.style.pointerEvents = "none";
       sRenderer.domElement.style.background = "#0d0b0a";
    document.body.appendChild(sRenderer.domElement);

    window.addEventListener("resize", onShatterResize, false);
    animateShatter();
  }

  function onShatterResize() {
    sVW = window.innerWidth;
    sVH = window.innerHeight;
    sCameraStart = 3.5 * sVH;
    if (sCamera) {
      sCamera.aspect = sVW / sVH;
      sCamera.fov = 2 * Math.atan(sVH / (2 * sCameraStart)) * (180 / Math.PI);
      sCamera.updateProjectionMatrix();
    }
    if (sGroup) {
      sGroup.position.x = -0.5 * sVW;
      sGroup.position.y = -0.5 * sVH;
    }
    if (sRenderer) sRenderer.setSize(sVW, sVH);
  }

  function sTriangulate() {
    sVertices = [];
    const rings = [
      { r: sVW / 12, c: 12 },
      { r: sVW / 8,  c: 12 },
      { r: sVW / 4,  c: 12 },
      { r: sVW,      c: 12 }
    ];
    const cx = sClickPos[0];
    const cy = sClickPos[1];
    sVertices.push([cx, cy]);

    for (let ri = 0; ri < rings.length; ri++) {
      const ring = rings[ri];
      const spread = 0.25 * ring.r;
      for (let h = 0; h < ring.c; h++) {
        const x = Math.cos(h / ring.c * TWO_PI_S) * ring.r + cx + sRandom(-spread, spread);
        const y = Math.sin(h / ring.c * TWO_PI_S) * ring.r + cy + sRandom(-spread, spread);
        sVertices.push([x, y]);
      }
    }

    for (let i = 0; i < sVertices.length; i++) {
      sVertices[i][0] = sClamp(sVertices[i][0], 0, sVW);
      sVertices[i][1] = sClamp(sVertices[i][1], 0, sVH);
    }

    const flat = new Float64Array(sVertices.length * 2);
    for (let k = 0; k < sVertices.length; k++) {
      flat[k * 2]     = sVertices[k][0];
      flat[k * 2 + 1] = sVertices[k][1];
    }
    const d = new Delaunator(flat);
    sIndices = Array.prototype.slice.call(d.triangles);
  }

  function sShatter() {
    let frontBox = null;
    let frontZ = -Infinity;
    sScene.traverse((obj) => {
      if (obj.userData && obj.userData.isWall && obj.position.z > frontZ) {
        frontZ = obj.position.z;
        frontBox = obj;
      }
    });
    if (!frontBox) return;

    const depth = frontBox.userData.depth;
    const tex = frontBox.userData.texture;

    sScene.remove(frontBox);
    frontBox.geometry.dispose();
    const oldMats = Array.isArray(frontBox.material) ? frontBox.material : [frontBox.material];
    for (let i = 0; i < oldMats.length; i++) oldMats[i].dispose();

    const sideColor = new THREE.Color(sBgColor).multiplyScalar(0.82);

    const batch = {
      tex: tex,
      frontMat: new THREE.MeshBasicMaterial({ map: tex }),
      sideMat: new THREE.MeshPhongMaterial({ color: sideColor }),
      count: 0
    };

    const extrudeOpts = {
      depth: depth, bevelEnabled: false, bevelSegments: 1,
      steps: 1, bevelSize: 0, bevelThickness: 0
    };

    const dur = 420 * SHATTER_TIME_SCALE;
    const zBase = frontZ - depth / 2;

    for (let o = 0; o < sIndices.length; o += 3) {
      const A = sVertices[sIndices[o]];
      const B = sVertices[sIndices[o + 1]];
      const C = sVertices[sIndices[o + 2]];

      const shape = new THREE.Shape();
      shape.moveTo(A[0], A[1]);
      shape.lineTo(B[0], B[1]);
      shape.lineTo(C[0], C[1]);
      shape.closePath();

      let geo;
      try { geo = new THREE.ExtrudeGeometry(shape, extrudeOpts); }
      catch (err) { continue; }

      const pos = geo.attributes.position;
      const uvArr = new Float32Array(pos.count * 2);
      for (let j = 0; j < pos.count; j++) {
        uvArr[j * 2]     = pos.getX(j) / sVW;
        uvArr[j * 2 + 1] = pos.getY(j) / sVH;
      }
      geo.setAttribute("uv", new THREE.BufferAttribute(uvArr, 2));

      const mesh = new THREE.Mesh(geo, [batch.frontMat, batch.sideMat]);
      mesh.position.set(0, 0, zBase);
      sGroup.add(mesh);

      const ccx = (A[0] + B[0] + C[0]) / 3;
      const ccy = (A[1] + B[1] + C[1]) / 3;
      const ddx = ccx - sClickPos[0];
      const ddy = ccy - sClickPos[1];
      const p = Math.sqrt(ddx * ddx + ddy * ddy);
      const delay = 0.0012 * p * sRandom(0.9, 1.1) * SHATTER_DELAY_SCALE;

      batch.count++;
      sActive.push({
        mesh: mesh, startY: mesh.position.y,
        t0: performance.now() + delay * 1000,
        dur: dur, batch: batch
      });
    }

    sVertices = [];
    sIndices = [];
  }

  function updateShatterShards() {
    const now = performance.now();
    for (let i = sActive.length - 1; i >= 0; i--) {
      const s = sActive[i];
      const t = (now - s.t0) / s.dur;
      if (t < 0) continue;
      const e = sEaseIn(Math.min(t, 1));
      s.mesh.position.y = s.startY - 3000 * e;
      if (t >= 1) {
        sGroup.remove(s.mesh);
        s.mesh.geometry.dispose();
        sActive.splice(i, 1);
        s.batch.count--;
        if (s.batch.count === 0) {
          s.batch.tex.dispose();
          s.batch.frontMat.dispose();
          s.batch.sideMat.dispose();
        }
      }
    }
  }

  function animateShatter() {
    requestAnimationFrame(animateShatter);
    updateShatterShards();
    if (sRenderer && sScene && sCamera) sRenderer.render(sScene, sCamera);
  }

  async function triggerShatterExit(clientX, clientY) {
    if (sBusy) return;
    sBusy = true;

    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const appEl = document.getElementById("app");

    try {
      sBgColor = "#f8f2e6";
      if (appEl) {
        const cs = getComputedStyle(appEl);
        if (cs.backgroundColor && cs.backgroundColor !== "rgba(0, 0, 0, 0)") {
          sBgColor = cs.backgroundColor;
        }
      }
      const domCanvas = await html2canvas(appEl, {
        width: vw, height: vh,
        windowWidth: vw, windowHeight: vh,
        x: 0, y: 0, scrollX: 0, scrollY: 0,
        useCORS: true, scale: 1, logging: false,
        backgroundColor: null,
        ignoreElements: (el) =>
          el.id === "canvas-host" || el === sRenderer.domElement || el.id === "case-exit" || el.id === "case-page"
      });

      renderer.render(scene, camera);

      const merged = document.createElement("canvas");
      merged.width = vw;
      merged.height = vh;
      const mctx = merged.getContext("2d");
      mctx.clearRect(0, 0, vw, vh);
      mctx.drawImage(domCanvas, 0, 0, vw, vh);
      mctx.drawImage(renderer.domElement, 0, 0, vw, vh);

      appEl.style.visibility = "hidden";
      sRenderer.domElement.style.display = "block";

      sClickPos[0] = clientX;
      sClickPos[1] = vh - clientY;

      const tex = new THREE.CanvasTexture(merged);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.minFilter = THREE.LinearFilter;
      tex.magFilter = THREE.LinearFilter;
      tex.premultiplyAlpha = false;

      const depth = sDepth();
      const geo = new THREE.BoxGeometry(vw, vh, depth);
      const sideColor = new THREE.Color(sBgColor).multiplyScalar(0.82);
      const sideMat = new THREE.MeshPhongMaterial({ color: sideColor });
      const mats = [
        sideMat, sideMat, sideMat, sideMat,
        new THREE.MeshBasicMaterial({ map: tex, transparent: true, alphaTest: 0.01 }),
        sideMat
      ];
      const box = new THREE.Mesh(geo, mats);
      box.position.z = -depth / 2;
      box.userData.depth = depth;
      box.userData.texture = tex;
      box.userData.isWall = true;
      sScene.add(box);

      sRenderer.render(sScene, sCamera);

      sTriangulate();
      sShatter();

      const startedAt = performance.now();
      (function checkAndNavigate() {
        const elapsed = performance.now() - startedAt;
        if (sActive.length === 0 || elapsed > SHATTER_MAX_WAIT) {
          window.location.href = "index.html";
        } else {
          setTimeout(checkAndNavigate, 50);
        }
      })();

    } catch (err) {
      appEl.style.visibility = "";
      window.location.href = "index.html";
    }
  }

  function playExitAnimation(clickX, clickY) {
    if (exitAnimating) return;
    exitAnimating = true;
    caseExit.style.display = "none";

    vel = 0; velX = 0; acc = 0; accX = 0; prev = 0; prevX = 0;
    autoSpin = false;
    currentQuat.identity();

    stepCircle();

    function stepCircle() {
      const radius = pxToWorld(getLogoOrbitRadius());
      const startSpin = spinAngle;
      const targetSpin = startSpin + Math.PI * 2;
      const state = { p: 0 };
      const count = tiles.length;
      const stepAngle = (Math.PI * 2) / count;
      const startRad = (CONFIG.logoStartAngle * Math.PI) / 180;

      tiles.forEach((t, i) => {
        const fromScale = { x: t.mesh.scale.x, y: t.mesh.scale.y };
        const baseAngle = startRad + stepAngle * i;

        const s = pxToWorld(getPlaneSize() * 0.8);
        const a = t.aspect || 1;
        const targetS = a >= 1 ? { x: s, y: s / a } : { x: s * a, y: s };

        tween(state, { p: 1 }, {
          duration: CONFIG.exitCircleDur,
          ease: Eases.power3out,
          onUpdate: () => {
            const ang = startSpin + (targetSpin - startSpin) * state.p;
            t.mesh.position.set(
              Math.cos(baseAngle + ang) * radius,
              Math.sin(baseAngle + ang) * radius,
              i * 0.015
            );
            t.mesh.scale.set(
              fromScale.x + (targetS.x - fromScale.x) * state.p,
              fromScale.y + (targetS.y - fromScale.y) * state.p,
              1
            );
          },
          onComplete: () => {
            if (i === 0) {
              spinAngle = targetSpin;
              stepSpin();
            }
          },
        });
      });
    }

    function stepSpin() {
      const startSpin = spinAngle;
      const targetSpin = startSpin + Math.PI * 2.6;
      const state = { p: 0 };
      const count = tiles.length;
      const stepAngle = (Math.PI * 2) / count;
      const startRad = (CONFIG.logoStartAngle * Math.PI) / 180;

      tween(state, { p: 1 }, {
        duration: CONFIG.exitSpinDur,
        ease: Eases.power2inOut,
        onUpdate: () => {
          const ang = startSpin + (targetSpin - startSpin) * state.p;
          const radius = pxToWorld(getLogoOrbitRadius());
          for (let i = 0; i < count; i++) {
            const t = tiles[i];
            const baseAngle = startRad + stepAngle * i;
            t.mesh.position.set(
              Math.cos(baseAngle + ang) * radius,
              Math.sin(baseAngle + ang) * radius,
              i * 0.015
            );
          }
        },
        onComplete: () => {
          spinAngle = targetSpin;
          stepStack();
        },
      });
    }

    function stepStack() {
const stackH = pxToWorld(CONFIG.stackGap);
      let done = 0;

      tiles.forEach((t, i) => {
        const fromPos = t.mesh.position.clone();
        const toPos = new THREE.Vector3(0, 0, i * stackH);
        t.mesh.renderOrder = i;
        const state = { p: 0 };
        tween(state, { p: 1 }, {
          duration: CONFIG.collapseDuration,
          ease: Eases.power2inOut,
          delay: i * CONFIG.collapseStagger,
          onUpdate: () => {
            t.mesh.position.lerpVectors(fromPos, toPos, state.p);
          },
          onComplete: () => {
            if (++done === tiles.length) stepVanish();
          },
        });
      });
    }

    function stepVanish() {
      let done = 0;
      tiles.forEach((t, i) => {
        const fromP = t.mesh.position.clone();
        const fromS = { x: t.mesh.scale.x, y: t.mesh.scale.y };
        const center = new THREE.Vector3(0, 0, 0);
        const state = { p: 0 };
        tween(state, { p: 1 }, {
          duration: CONFIG.exitVanishDur,
          ease: Eases.power3in,
          delay: i * 0.01,
          onUpdate: () => {
            t.mesh.position.lerpVectors(fromP, center, state.p);
            t.mesh.scale.set(
              Math.max(0.001, fromS.x * (1 - state.p)),
              Math.max(0.001, fromS.y * (1 - state.p)),
              1
            );
          },
          onComplete: () => {
            if (++done === tiles.length) {
              renderer.render(scene, camera);
              triggerShatterExit(clickX, clickY);
            }
          },
        });
      });
    }
  }

  if (typeof THREE !== "undefined" && typeof Delaunator !== "undefined" && typeof html2canvas !== "undefined") {
    initShatterRenderer();
    caseExit.addEventListener("click", (e) => {
      if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      e.preventDefault();
      playExitAnimation(e.clientX, e.clientY);
    });
  } else {
    caseExit.addEventListener("click", (e) => {
      if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      e.preventDefault();
      window.location.href = "index.html";
    });
  }

  // ============ tick ============
  let last = performance.now();
  function tick(now) {
    requestAnimationFrame(tick);
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;

    updateTweens(dt);

    if (caseOpen) return;

    if (isLoading && !isCollapsing) {
      spinAngle += CONFIG.circleSpin * (1 + (CONFIG.fastSpinMult - 1) * fastRamp.v) * dt;
      placePreloaderTiles();
    }

    if (!isLoading && !exitAnimating) {
      acc += vel; accX += velX;
      vel *= CONFIG.friction; velX *= CONFIG.friction;
      const step = (acc - prev) * CONFIG.smoothing;
      const stepX = (accX - prevX) * CONFIG.smoothing;
      prev = acc; prevX = accX;
      if (Math.abs(step) > 1e-6) {
        currentQuat.premultiply(new THREE.Quaternion().setFromAxisAngle(spinAxis, step));
      }
      if (Math.abs(stepX) > 1e-6) {
        const perp = new THREE.Vector3(1, 0, 0).applyQuaternion(currentQuat);
        currentQuat.premultiply(new THREE.Quaternion().setFromAxisAngle(perp, stepX));
      }

      const spinning =
        Math.abs(vel) > 1e-4 ||
        Math.abs(velX) > 1e-4 ||
        Math.abs(step) > 1e-5 ||
        Math.abs(stepX) > 1e-5;
      if (spinning !== exitFaded) {
        exitFaded = spinning;
        caseExit.classList.toggle("is-faded", spinning);
      }
    }
    if (autoSpin && !userInteracted && !exitAnimating) {
      currentQuat.premultiply(new THREE.Quaternion().setFromAxisAngle(spinAxis, CONFIG.autoSpeed));
    }
    currentQuat.normalize();
    group.quaternion.copy(currentQuat);

    for (const t of tiles) {
      t.mesh.quaternion.copy(currentQuat).invert();

      if (exploded && t.expStartPos && !exitAnimating) {
        const e = t.explode;
        const os = 1 + CONFIG.explodeOvershoot * Math.sin(Math.PI * e);
        t.mesh.position.set(
          (t.expStartPos.x + (t.basePos.x - t.expStartPos.x) * e) * os,
          (t.expStartPos.y + (t.basePos.y - t.expStartPos.y) * e) * os,
          (t.expStartPos.z + (t.basePos.z - t.expStartPos.z) * e) * os
        );
        const targetS = computeTargetScale(t);
        t.mesh.scale.set(
          t.expStartScale.x + (targetS.x - t.expStartScale.x) * e,
          t.expStartScale.y + (targetS.y - t.expStartScale.y) * e,
          1
        );
      }
    }

    renderer.render(scene, camera);
  }

  function computeTargetScale(t) {
    const s = pxToWorld(getPlaneSize());
    const a = t.aspect || 1;
    return a >= 1 ? { x: s, y: s / a } : { x: s * a, y: s };
  }

  requestAnimationFrame(tick);

  const initialSlug = new URLSearchParams(location.search).get("slug");
  if (initialSlug && CASES[initialSlug]) {
    setTimeout(() => {
      if (isLoading) return;
      openCase(initialSlug);
    }, 1500);
  }
})();
</script>
</body>
</html>
