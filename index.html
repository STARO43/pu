<script>
var REVEAL_DURATION = 2400;
var REVEAL_BLUR     = 8;
var REVEAL_WAVE     = 900;

function revealNow(el, delay){
  if (!el) return null;
  return el.animate(
    [
      { opacity: 0, filter: 'blur(' + REVEAL_BLUR + 'px)' },
      { opacity: 1, filter: 'blur(0)' }
    ],
    {
      duration: REVEAL_DURATION,
      delay:    delay || 0,
      easing:   'cubic-bezier(.4,0,.2,1)',
      fill:     'both'
    }
  );
}

function hideInstant(el){
  if (!el) return;
  if (el._revealAnim){
    try { el._revealAnim.cancel(); } catch(e){}
    el._revealAnim = null;
  }
  el.style.opacity = '';
  el.style.filter  = '';
}

function revealList(elements, startDelay, step){
  var anims = [];
  for (var i = 0; i < elements.length; i++){
    var el = elements[i];
    if (!el) continue;
    hideInstant(el);
    var a = revealNow(el, (startDelay || 0) + i * (step || 0));
    el._revealAnim = a;
    anims.push(a);
  }
  return anims;
}
</script>

<script>
(function(){
  var isMenuOpen = false;
  var isHelpOpen = false;
  var MOBILE_MQ = window.matchMedia('(max-width: 600px)');

  function setMenu(open){
    if (isMenuOpen === open) return;
    isMenuOpen = open;
    if (open) setHelp(false);
    document.body.classList.toggle('is-menu', open);
  }

  function setHelp(open){
    if (isHelpOpen === open) return;
    isHelpOpen = open;
    if (open) setMenu(false);
    document.body.classList.toggle('is-help', open);
    if (open) startHelpSequence(); else stopHelpSequence();
  }

  var coarse = window.matchMedia('(hover: none), (pointer: coarse)').matches;

  if (coarse) {
    var TAP_MAX_MOVE   = 12;
    var TAP_MAX_TIME   = 600;
    var tapStartX = 0, tapStartY = 0, tapStartT = 0, tapTracking = false;

    window.addEventListener('touchstart', function(e){
      if (e.touches.length !== 1) { tapTracking = false; return; }
      if (e.target.closest('a, button')) { tapTracking = false; return; }
      var t = e.touches[0];
      tapStartX = t.clientX; tapStartY = t.clientY; tapStartT = performance.now();
      tapTracking = true;
    }, { passive: true });

    window.addEventListener('touchmove', function(e){
      if (!tapTracking) return;
      if (e.touches.length !== 1) { tapTracking = false; return; }
      var t = e.touches[0];
      var dx = t.clientX - tapStartX;
      var dy = t.clientY - tapStartY;
      if (dx*dx + dy*dy > TAP_MAX_MOVE * TAP_MAX_MOVE) {
        tapTracking = false;
      }
    }, { passive: true });

    window.addEventListener('touchend', function(e){
      if (!tapTracking) return;
      tapTracking = false;
      if (performance.now() - tapStartT > TAP_MAX_TIME) return;
      if (e.target.closest('a, button')) return;
      if (isHelpOpen) { setHelp(false); return; }
      setMenu(!isMenuOpen);
    }, { passive: true });

    window.addEventListener('touchcancel', function(){ tapTracking = false; }, { passive: true });
  } else {
    window.addEventListener('dblclick', function(e){
      if (e.target.closest('a, button')) return;
      if (isHelpOpen) { setHelp(false); return; }
      setMenu(!isMenuOpen);
    });
  }

  var helpBtn = document.getElementById('help-btn');
  helpBtn.addEventListener('click', function(e){
    e.preventDefault();
    e.stopPropagation();
    setHelp(!isHelpOpen);
  });

  var lids = document.querySelectorAll('.blink-lid');
  var links = document.querySelectorAll('.menu-link');
  links.forEach(function(link){
    link.addEventListener('click', function(e){
      e.preventDefault();
      var href = link.getAttribute('href');
      lids[0].style.transition = 'transform 0.35s ease-in';
      lids[1].style.transition = 'transform 0.35s ease-in';
      lids[0].style.transform = 'scaleY(1)';
      lids[1].style.transform = 'scaleY(1)';
      setTimeout(function(){ window.location.href = href; }, 380);
    });
  });

  var menuLinks = Array.prototype.slice.call(document.querySelectorAll('#menu .menu-link'));
  var menuWasOpen = false;
  setInterval(function(){
    var open = document.body.classList.contains('is-menu');
    if (open === menuWasOpen) return;
    menuWasOpen = open;
    if (open){
      setTimeout(function(){ revealList(menuLinks, 0, REVEAL_WAVE); }, 900);
    } else {
      menuLinks.forEach(hideInstant);
    }
  }, 60);

  var QUOTES = [
    {
      text: 'До Пушкина литература — светская забава, литератор в лучшем случае — придворный, как Дмитриев, Державин, Жуковский, или мелкий чиновник — как Фонвизин, Пнин, Рылеев. Если он придворный — с ним считаются, но покуда он чиновник — его третируют как забавника, как шута.\n\nПушкин первый почувствовал, что литература — национальное дело первостепенной важности, что она выше работы в канцеляриях и службы во дворце, он первый поднял звание литератора на высоту до него недосягаемую: в его глазах поэт — выразитель всех чувств и дум народа, он призван понять и изобразить все явления жизни.',
      author: 'Максим Горький'
    },
    {
      text: 'Язык создается народом. Деление языка на литературный и народный значит только то, что мы имеем, так сказать, "сырой" язык и обработанный мастерами. Первым, кто прекрасно понял это, был Пушкин, он же первый и показал, как следует пользоваться речевым материалом народа, как надобно обрабатывать его.',
      author: 'Максим Горький'
    },
    {
      text: 'Пушкин есть явление чрезвычайное и, может быть единственное явление русского духа: это русский человек в его развитии, в каком он, может быть, явится через двести лет. В нем русская природа, русская душа, русский язык, русский характер отразились в такой же чистоте, в такой очищенной красоте, в какой отражается ландшафт на выпуклой поверхности оптического стекла.',
      author: 'Николай Гоголь'
    },
    {
      text: 'Мы будем надеяться, что всякий наш потомок, с любовью остановившийся перед изваянием Пушкина и понимающий значение этой любви, тем самым докажет, что он, подобно Пушкину, стал более русским и более образованным, более свободным человеком! Будем также надеяться, что в недальнем времени даже сыновьям нашего простого народа, который теперь не читает нашего поэта, станет понятно, что значит это имя: Пушкин!',
      author: 'Иван Тургенев'

    {
      text: 'Одна лишь звонкая и широкая песнь Пушкина звучала в долинах рабства и мучений; эта песнь продолжала эпоху прошлую, наполняла мужественными звуками настоящее и посылала свой голос в отдаленное будущее.',
      author: 'Александр Герцен'
    }
  ];

  var SHOW_MS  = 36000;

  var WORDS_PER_SEC      = 6;
  var EXIT_WORDS_PER_SEC = 22;

  var wrapEl   = document.getElementById('help-quote-wrap');
  var quoteEl  = document.getElementById('help-quote');
  var authorEl = document.getElementById('help-author');
  var infoEl   = document.getElementById('help-info');
  var quoteTimer = null;
  var quoteIndex = 0;

  function applyInfoText(){
    if (coarse){
      infoEl.textContent = 'Для связи @vnvax';
    } else {
      infoEl.textContent = 'Для сведения: двойной клик — переходы; в биографии — закладки справа снизу; для связи @vnvax';
    }
  }
  applyInfoText();
  if (MOBILE_MQ.addEventListener){
    MOBILE_MQ.addEventListener('change', applyInfoText);
  } else if (MOBILE_MQ.addListener){
    MOBILE_MQ.addListener(applyInfoText);
  }

  function buildQuote(text){
    quoteEl.innerHTML = '';
    var paragraphs = text.split(/\n\n+/);
    var globalWordIndex = 0;

    paragraphs.forEach(function(pText){
      var pEl = document.createElement('p');
      pEl.className = 'quote-p';
      var words = pText.trim().split(/\s+/).filter(Boolean);
      words.forEach(function(w, wi){
        var span = document.createElement('span');
        span.className = 'word';
        span.textContent = w;
        span.style.transitionDelay =
          (globalWordIndex * (1000 / WORDS_PER_SEC)) + 'ms';
        globalWordIndex++;
        pEl.appendChild(span);
        if (wi < words.length - 1){
          pEl.appendChild(document.createTextNode(' '));
        }
      });
      quoteEl.appendChild(pEl);
    });
  }

  function fitQuote(){
    if (!document.body.classList.contains('is-help')) return;
    var container = document.getElementById('help-menu');
    if (!container || !quoteEl || !authorEl) return;

    quoteEl.style.fontSize = '1rem';
    quoteEl.style.width = '';
    void quoteEl.offsetWidth;

    var cs   = getComputedStyle(container);
    var padT = parseFloat(cs.paddingTop)    || 0;
    var padB = parseFloat(cs.paddingBottom) || 0;

    var topEl    = container.querySelector('.help-top');
    var footerEl = container.querySelector('.help-footer');
    var topH     = topEl    ? topEl.offsetHeight    : 0;
    var footerH  = footerEl ? footerEl.offsetHeight : 0;
    var authorH  = authorEl.offsetHeight;
    var wrapGap  = parseFloat(getComputedStyle(wrapEl).rowGap) || 0;

    var availH = container.clientHeight - padT - padB - topH - footerH - authorH - wrapGap * 2 - 40;
    var availW = wrapEl.clientWidth || Math.min(window.innerWidth * 0.92, 760);

    if (availW <= 0) availW = Math.min(window.innerWidth * 0.92, 760);
    if (availH < 40) availH = 40;

    quoteEl.style.width = availW + 'px';

    var isMobile = MOBILE_MQ.matches;
    var lo = isMobile ? 9 : 11, hi = 44, best = lo;
    for (var i = 0; i < 14; i++){
      var mid = (lo + hi) / 2;
      quoteEl.style.fontSize = mid + 'px';
      var fits = quoteEl.scrollHeight <= availH + 1 &&
                 quoteEl.scrollWidth  <= availW + 1;
      if (fits){ best = mid; lo = mid; } else { hi = mid; }
    }
    quoteEl.style.fontSize = best + 'px';
    quoteEl.style.width = '';
  }

  function showQuoteAnimated(){
    var q = QUOTES[quoteIndex];
    wrapEl.classList.remove('is-shown');

    buildQuote(q.text);
    authorEl.textContent = q.author;

    void quoteEl.offsetHeight;
    fitQuote();
    void wrapEl.offsetHeight;

    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        if (!document.body.classList.contains('is-help')) return;
        wrapEl.classList.add('is-shown');
      });
    });
  }

  function hideQuoteAnimated(done){
    var words = quoteEl.querySelectorAll('.word');
    var n = words.length;
    var stepMs = 1000 / EXIT_WORDS_PER_SEC;
    for (var i = 0; i < n; i++){
      var w = words[n - 1 - i];
      w.style.transitionDelay  = (i * stepMs) + 'ms';
      w.style.transitionDuration = '1.6s';
    }
    wrapEl.classList.remove('is-shown');

    setTimeout(function(){
      quoteEl.innerHTML = '';
      authorEl.textContent = '';
      if (done) done();
    }, FADE_OUT);
  }

  function showInfoAnimated(){
    infoEl.classList.remove('is-shown');
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        if (!document.body.classList.contains('is-help')) return;
        infoEl.classList.add('is-shown');
      });
    });
  }

  function hideInfoAnimated(){
    infoEl.classList.remove('is-shown');
  }

  var helpTitleMain = document.querySelector('.help-top .title-main');
  var helpTitleSub  = document.querySelector('.help-top .title-sub');
  var seqTimers = [];

  function clearSeqTimers(){
    for (var i = 0; i < seqTimers.length; i++) clearTimeout(seqTimers[i]);
    seqTimers.length = 0;
  }

  function startHelpSequence(){
    stopHelpSequence();
    quoteIndex = Math.floor(Math.random() * QUOTES.length);

    revealList([helpTitleMain], 0, 0);
    revealList([helpTitleSub],  260, 0);

    var TITLE_DONE = 260 + REVEAL_DURATION + 240;

    seqTimers.push(setTimeout(function(){
      if (!document.body.classList.contains('is-help')) return;
      showQuoteAnimated();
      scheduleNext();
    }, TITLE_DONE));

    seqTimers.push(setTimeout(function(){
      if (!document.body.classList.contains('is-help')) return;
      showInfoAnimated();
    }, TITLE_DONE + 2600));
  }

  function stopHelpSequence(){
    clearSeqTimers();
    hideInstant(helpTitleMain);
    hideInstant(helpTitleSub);
    if (quoteTimer){ clearTimeout(quoteTimer); quoteTimer = null; }
    hideInfoAnimated();
    wrapEl.classList.remove('is-shown');
    setTimeout(function(){
      if (document.body.classList.contains('is-help')) return;
      quoteEl.innerHTML = '';
      authorEl.textContent = '';
    }, FADE_OUT);
  }

  function scheduleNext(){
    if (quoteTimer){ clearTimeout(quoteTimer); quoteTimer = null; }
    quoteTimer = setTimeout(function(){
      if (!document.body.classList.contains('is-help')) return;
      hideQuoteAnimated(function(){
        if (!document.body.classList.contains('is-help')) return;
        quoteIndex = (quoteIndex + 1) % QUOTES.length;
        showQuoteAnimated();
        scheduleNext();
      });
    }, SHOW_MS);
  }

  window.addEventListener('resize', function(){
    if (document.body.classList.contains('is-help')) fitQuote();
  });

  if (window.visualViewport){
    window.visualViewport.addEventListener('resize', function(){
      if (document.body.classList.contains('is-help')) fitQuote();
    });
  }
})();
</script>

<script type="module">
const HAS_IMPORTMAP = window.__HAS_IMPORTMAP__ === true;
const NO_WEBGL = document.body.classList.contains('no-webgl');

if (!NO_WEBGL) {
  let THREE, EffectComposer, RenderPass, ShaderPass;

  try {
    if (HAS_IMPORTMAP) {
      THREE = await import('three');
      ({ EffectComposer } = await import('three/addons/postprocessing/EffectComposer.js'));
      ({ RenderPass }     = await import('three/addons/postprocessing/RenderPass.js'));
      ({ ShaderPass }     = await import('three/addons/postprocessing/ShaderPass.js'));
    } else {
      THREE = await import('./vendor/three.module.js');
    }
  } catch (e) {
    document.body.classList.add('gl-broken');
    throw e;
  }

  const clamp = (v,a,b) => Math.min(b, Math.max(a, v));
  const ease  = {
    expoOut:    t => t >= 1 ? 1 : 1 - Math.pow(2, -10*t),
    inOutCubic: t => t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2,
    outCubic:   t => 1 - Math.pow(1 - t, 3),
    inQuad:     t => t * t,
  };

  const host = document.getElementById('stage');
  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({
      antialias:true, alpha:false, powerPreference:'high-performance'
    });
  } catch(e){
    document.body.classList.add('gl-broken');
    throw e;
  }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setClearColor(0x0a0806, 1);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.00;
  renderer.domElement.style.cssText = 'display:block;width:100%;height:100%;';
  host.appendChild(renderer.domElement);

  const scene  = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
  camera.position.set(0, 0, 5);

  const vertexShader = `
varying vec2 vUv;
void main() {
  vUv = uv;
  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
}
`;

  const fragmentShader = `
precision highp float;
varying vec2 vUv;

uniform sampler2D uMap;
uniform vec2  uRes;
uniform vec2  uImg;
uniform float uTime;
uniform float uReveal;
uniform vec2  uParallax;
uniform float uZoom;
uniform vec2  uEyeUV;
uniform vec2  uZoomTarget;
uniform float uHelpZoom;
uniform float uHasMap;

float hash1(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float noise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  vec2 u = f*f*(3.0 - 2.0*f);
  return mix(mix(hash1(i), hash1(i+vec2(1,0)), u.x),
             mix(hash1(i+vec2(0,1)), hash1(i+vec2(1,1)), u.x), u.y);
}
float fbm(vec2 p) {
  float v = 0.0, a = 0.5;
  for (int i = 0; i < 5; i++) { v += a * noise(p); p = p * 2.02 + 13.7; a *= 0.5; }
  return v;
}

void main() {
  float sa = uRes.x / uRes.y;
  float ia = max(uImg.x / uImg.y, 0.0001);
  float t  = uTime;
  float zs = uZoom;

  vec2 p = vec2((vUv.x - 0.5) * sa, vUv.y - 0.5);

  float parFade = 1.0 - zs;
  p.x += uParallax.x * 0.018 * parFade;
  p.y += uParallax.y * 0.014 * parFade;

  float breath = 1.0 + sin(t * 0.40) * 0.0032 + sin(t * 0.17 + 1.2) * 0.0014;
  p /= breath;

  float k = max(1.0, sa / ia) * 1.10;
  vec2 uvBase = vec2(p.x / (ia * k) + 0.5, p.y / k + 0.5);
  uvBase.x -= 0.035;

  vec2 zc = mix(uEyeUV + vec2(-0.028, 0.004) * zs, uZoomTarget, step(0.0001, uHelpZoom));

  float zoomScale = pow(38.0, zs);
  vec2  uv        = (uvBase - zc) / zoomScale + zc;
  vec2  uvSafe    = clamp(uv, vec2(0.001), vec2(0.999));

  vec3 col = texture2D(uMap, uvSafe).rgb;

  vec3 fireOnly = vec3(0.020, 0.012, 0.008);
  col = mix(fireOnly, col, uHasMap);

  vec2 bgUV = uvSafe * uImg * 0.06;
  float surfaceNoise  = fbm(bgUV + vec2(t * 0.015));
  float surfaceNoise2 = fbm(bgUV * 3.0 - vec2(t * 0.02));
  float relief = (surfaceNoise - 0.5) * 0.45 + (surfaceNoise2 - 0.5) * 0.15;
  col = col * (1.0 + relief);

  col *= vec3(1.02, 0.98, 0.94);
  col *= 0.74;

  float flick = 0.82
    + sin(t * 2.7) * 0.045
    + sin(t * 6.9 + 1.3) * 0.038
    + sin(t * 12.4 + 2.7) * 0.028
    + (fbm(vec2(t * 2.2, 3.0)) - 0.5) * 0.15;

  vec2 firePos = vec2(sa * 0.50, -0.60);
  vec2 fd = p - firePos;
  float fireDist = dot(fd, fd);

  vec3 fireWarm = vec3(0.95, 0.36, 0.12);
  vec3 fireDeep = vec3(0.70, 0.16, 0.05);
  col += fireWarm * exp(-fireDist * 1.7) * flick * 0.090;
  col += fireDeep * exp(-fireDist * 3.4) * flick * 0.055;

  float fireMask = smoothstep(0.0, 0.55, exp(-fireDist * 2.0) * flick);
  col *= mix(vec3(1.0), vec3(1.06, 0.86, 0.68), fireMask * 0.55);

  float reflFire = exp(-fireDist * 1.5) * flick * 0.045;
  col += vec3(1.0, 0.55, 0.28) * reflFire;

  float cornerGlow = exp(-fireDist * 8.0) * flick;
  col += vec3(1.0, 0.45, 0.15) * cornerGlow * 0.35;

  float candle =
      1.0
    + sin(t * 7.3) * 0.018
    + sin(t * 13.1 + 1.7) * 0.012
    + sin(t * 3.3 + 0.5) * 0.008
    + (fbm(vec2(t * 1.7, 7.0)) - 0.5) * 0.040;
  col *= candle;
  col *= mix(vec3(1.0), vec3(1.035, 0.995, 0.945), (candle - 1.0) * 6.0 + 0.5);

  vec2 vc = p * vec2(0.85, 0.72);
  float vd = length(vc);
  col *= 1.0 - smoothstep(0.45, 1.10, vd) * 0.55;

  float g = hash1(gl_FragCoord.xy + fract(t) * 137.0);
  col += (g - 0.5) * 0.020;

  vec2 eDiff = uv - zc;
  float eDist = dot(eDiff, eDiff);
  float eyeGlow = exp(-eDist * 55.0) * sin(zs * 3.14159265);
  col += vec3(1.0, 0.74, 0.46) * eyeGlow * 0.38;

  float halo = exp(-eDist * 6.0) * sin(zs * 3.14159265) * 0.10;
  col += vec3(1.0, 0.55, 0.28) * halo;

  col = mix(col, col * vec3(1.06, 0.94, 0.84), zs * 0.55);

  float blackOut = smoothstep(0.72, 1.0, zs);
  col *= (1.0 - blackOut);

  col *= uReveal;

  gl_FragColor = vec4(col, uReveal);
}
`;

  const uniforms = {
    uMap:        { value: null },
    uRes:        { value: new THREE.Vector2(1, 1) },
    uImg:        { value: new THREE.Vector2(1, 1) },
    uTime:       { value: 0 },
    uReveal:     { value: 0 },
    uParallax:   { value: new THREE.Vector2(0, 0) },
    uZoom:       { value: 0 },
    uEyeUV:      { value: new THREE.Vector2(0.34, 0.57) },
    uZoomTarget: { value: new THREE.Vector2(0.999, 0.001) },
    uHelpZoom:   { value: 0 },
    uHasMap:     { value: 0 }
  };

  const material = new THREE.ShaderMaterial({
    uniforms, vertexShader, fragmentShader,
    transparent: true, depthWrite: false, depthTest: false
  });

  const plane = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), material);
  plane.frustumCulled = false;
  scene.add(plane);

  const phTex = new THREE.DataTexture(new Uint8Array([20, 16, 12, 255]), 1, 1, THREE.RGBAFormat);
  phTex.needsUpdate = true;
  uniforms.uMap.value = phTex;

  let composer = null;
  let finalPass = null;

  if (HAS_IMPORTMAP && EffectComposer && RenderPass && ShaderPass) {
    composer = new EffectComposer(renderer);
    composer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    composer.addPass(new RenderPass(scene, camera));

    finalPass = new ShaderPass({
      uniforms: {
        tDiffuse: { value: null },
        uTime:    { value: 0 },
        uRes:     { value: new THREE.Vector2(1, 1) },
        uGrain:   { value: 0.016 }
      },
      vertexShader: `
varying vec2 vUv;
void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }
`,
      fragmentShader: `
precision highp float;
varying vec2 vUv;
uniform sampler2D tDiffuse;
uniform float uTime;
uniform vec2  uRes;
uniform float uGrain;
float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
void main(){
  vec3 col = texture2D(tDiffuse, vUv).rgb;
  vec2 t = vUv * uRes;
  float g1 = hash(t * 0.7 + fract(uTime * 8.0) * 100.0) - 0.5;
  float g2 = hash(t * 0.3 + fract(uTime * 5.0) * 100.0) - 0.5;
  float grain = g1 * 0.65 + g2 * 0.35;
  col += grain * uGrain;
  gl_FragColor = vec4(col, 1.0);
}
`
    });
    composer.addPass(finalPass);
  }

  function resize() {
    const w = host.clientWidth || window.innerWidth;
    const h = host.clientHeight || window.innerHeight;
    if (!w || !h) return;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    const vh = 2 * Math.tan(camera.fov * Math.PI / 360) * camera.position.z;
    const vw = vh * camera.aspect;
    plane.scale.set(vw, vh, 1);
    uniforms.uRes.value.set(w, h);
    if (composer) composer.setSize(w, h);
    if (finalPass) finalPass.uniforms.uRes.value.set(w, h);
  }

  const clock = new THREE.Clock();
  let elapsed = 0;
  let revealStart = -1;

  const parallaxTarget  = new THREE.Vector2(0, 0);
  const parallaxCurrent = new THREE.Vector2(0, 0);

  function startReveal() {
    if (revealStart >= 0) return;
    revealStart = performance.now();
  }
  startReveal();

  let hasMapStart    = -1;
  let hasMapDuration = 6000;

  new THREE.TextureLoader().load('pushkin.jpg', (tex) => {
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.anisotropy = Math.min(16, renderer.capabilities.getMaxAnisotropy());
    tex.minFilter = THREE.LinearMipmapLinearFilter;
    tex.magFilter = THREE.LinearFilter;
    tex.generateMipmaps = true;
    if (uniforms.uMap.value && uniforms.uMap.value.dispose) {
      uniforms.uMap.value.dispose();
    }
    uniforms.uMap.value = tex;
    uniforms.uImg.value.set(tex.image.width || 1, tex.image.height || 1);
    hasMapStart = performance.now();
    resize();
    computeHelpUV();
  }, undefined, () => {
    console.warn('portrait load failed');
  });

  window.addEventListener('pointermove', (e) => {
    const cx = window.innerWidth / 2;
    const cy = window.innerHeight / 2;
    parallaxTarget.set((e.clientX - cx) / cx, (e.clientY - cy) / cy);
  }, { passive: true });

  function computeHelpUV() {
    const iw = uniforms.uImg.value.x;
    const ih = uniforms.uImg.value.y;
    if (iw <= 1 && ih <= 1) return;

    const w = window.innerWidth;
    const h = window.innerHeight;
    const sa = w / h;
    const ia = (iw / ih) || 1;

    const btnCX = 1 - 1 / w;
    const btnCY = 1 - 1 / h;

    const px = (btnCX - 0.5) * sa;
    const py = (0.5 - btnCY);

    const k = Math.max(1.0, sa / ia) * 1.10;
    let ux = px / (ia * k) + 0.5;
    let uy = py / k + 0.5;
    ux -= 0.035;

    uniforms.uZoomTarget.value.set(ux, uy);
  }

  computeHelpUV();
  window.addEventListener('resize', computeHelpUV);

  let menuProgress = 0;
  let helpProgress = 0;
  let anim = null;
  let animHelp = null;
  let lastMenuOpen = false;
  let lastHelpOpen = false;

  function setMenuProgress(target, dur, easing) {
    anim = {
      from:  menuProgress,
      to:    target,
      start: performance.now(),
      dur:   dur,
      ease:  easing
    };
  }

  function setHelpProgress(target, dur, easing) {
    animHelp = {
      from:  helpProgress,
      to:    target,
      start: performance.now(),
      dur:   dur,
      ease:  easing
    };
  }

  function tick() {
    requestAnimationFrame(tick);

    const dt = Math.min(0.05, clock.getDelta());
    elapsed += dt;

    uniforms.uTime.value = elapsed;

    const menuOpen = document.body.classList.contains('is-menu');
    const helpOpen = document.body.classList.contains('is-help');

    if (menuOpen !== lastMenuOpen) {
      lastMenuOpen = menuOpen;
      if (menuOpen) {
        setMenuProgress(1, 1800, ease.inOutCubic);
      } else {
        setMenuProgress(0, 1500, ease.outCubic);
      }
    }

    if (helpOpen !== lastHelpOpen) {
      lastHelpOpen = helpOpen;
      if (helpOpen) {
        computeHelpUV();
        setHelpProgress(1, 1800, ease.inOutCubic);
      } else {
        setHelpProgress(0, 1500, ease.outCubic);
      }
    }

    if (anim) {
      const t = clamp((performance.now() - anim.start) / anim.dur, 0, 1);
      const e = anim.ease(t);
      menuProgress = anim.from + (anim.to - anim.from) * e;
      if (t >= 1) anim = null;
    }

    if (animHelp) {
      const t = clamp((performance.now() - animHelp.start) / animHelp.dur, 0, 1);
      const e = animHelp.ease(t);
      helpProgress = animHelp.from + (animHelp.to - animHelp.from) * e;
      if (t >= 1) animHelp = null;
    }

    const combinedZoom = Math.max(menuProgress, helpProgress);
    uniforms.uZoom.value = clamp(combinedZoom, 0, 1);
    uniforms.uHelpZoom.value = clamp(helpProgress, 0, 1);

    if (revealStart > 0) {
      const raw = (performance.now() - revealStart) / 2400;
      uniforms.uReveal.value = ease.expoOut(clamp(raw, 0, 1));
    }

    if (hasMapStart > 0 && uniforms.uHasMap.value < 1.0) {
      const raw = (performance.now() - hasMapStart) / hasMapDuration;
      uniforms.uHasMap.value = ease.expoOut(clamp(raw, 0, 1));
    }

    parallaxCurrent.lerp(parallaxTarget, Math.min(1, dt * 2.5));
    uniforms.uParallax.value.copy(parallaxCurrent);

    if (finalPass) finalPass.uniforms.uTime.value = elapsed;
    if (composer) composer.render();
    else renderer.render(scene, camera);
  }

  resize();
  if (window.ResizeObserver) new ResizeObserver(resize).observe(host);
  else window.addEventListener('resize', resize);

  requestAnimationFrame(tick);
}
</script>
