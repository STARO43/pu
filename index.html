<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0806">
<link rel="icon" href="/favicon.ico" sizes="any">
<title>Пушкин. Главное</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yeseva+One&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{
  margin:0;height:100%;
  background:#0a0806;color:#fbf2ed;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  user-select:none;-webkit-user-select:none;
}
#bg{
  position:fixed;inset:0;z-index:1;
  background:#0a0806 url('./pushkin.jpg') center/cover no-repeat;
  filter:brightness(0.30) contrast(1.06) saturate(0.8);
}
#bg::after{
  content:'';position:absolute;inset:0;
  background:
    radial-gradient(ellipse at 50% 100%, rgba(255,90,20,0.10), transparent 55%),
    radial-gradient(circle at 50% 40%, transparent 22%, rgba(5,3,2,0.94) 100%);
}
#menu{
  position:fixed;inset:0;z-index:10;
  display:flex;flex-direction:column;justify-content:center;
  padding-left:clamp(40px,8vw,140px);
  background:radial-gradient(circle at 30% 50%, rgba(20,15,10,0.55) 0%, rgba(10,8,6,0.82) 60%, rgba(3,2,1,0.97) 100%);
}
.menu-link{
  position:relative;display:inline-block;width:fit-content;
  text-decoration:none;
  font-family:'Yeseva One', serif;
  font-size:clamp(2.4rem,9vw,8.5rem);
  line-height:1.05;
  color:#f4e8d8;
  margin-bottom:clamp(1rem,3vw,2rem);
  z-index:3;
}
.menu-link .label{ display:inline-block; color:#f4e8d8; transition:color .4s ease; }
body.media-on .menu-link .label{ color:transparent; }

#canvas-layer{
  position:fixed;inset:0;z-index:5;
  pointer-events:none;
  opacity:0;
  transition:opacity .6s ease;
}
#canvas-layer.ready{ opacity:1; }
#canvas-layer canvas{ display:block; width:100%; height:100%; }

#controls{
  position:fixed;z-index:30;
  left:50%;bottom:clamp(16px,3.5vh,40px);
  transform:translateX(-50%);
  display:flex;gap:8px;
  padding:8px 12px;
  background:rgba(12,9,7,0.60);
  border:1px solid rgba(255,200,150,0.10);
  border-radius:999px;
  backdrop-filter:blur(12px);
}
.fx-btn{
  appearance:none;border:1px solid rgba(255,200,150,0.18);
  background:rgba(255,220,180,0.04);
  color:rgba(244,232,216,0.82);
  font-family:'Yeseva One', serif;
  font-size:clamp(0.6rem,1.4vw,0.78rem);
  letter-spacing:0.12em;text-transform:uppercase;
  padding:clamp(6px,1vh,9px) clamp(10px,1.8vw,18px);
  border-radius:999px;cursor:pointer;
}
.fx-btn.active{
  background:rgba(255,180,110,0.18);
  border-color:rgba(255,180,110,0.60);
  color:#ffe6cc;
}
</style>
</head>
<body>

<div id="bg" aria-hidden="true"></div>

<div id="canvas-layer" aria-hidden="true">
  <canvas></canvas>
</div>

<div id="menu">
  <a href="/bio" class="menu-link" id="link-bio">
    <span class="label">Жизнь</span>
  </a>
  <a href="/po" class="menu-link" id="link-poems">
    <span class="label">Поэзия</span>
  </a>
</div>

<video id="src-video" src="./1.mp4" muted autoplay loop playsinline preload="auto" style="position:fixed;left:-9999px;top:-9999px;width:2px;height:2px;opacity:0;pointer-events:none;"></video>

<div id="controls">
  <button class="fx-btn active" data-mode="video" type="button">Видео</button>
  <button class="fx-btn" data-mode="off" type="button">Выкл</button>
</div>

<script>
(function(){
  'use strict';

  var menu    = document.getElementById('menu');
  var layer   = document.getElementById('canvas-layer');
  var canvas  = layer.querySelector('canvas');
  var ctx     = canvas.getContext('2d');
  var video   = document.getElementById('src-video');
  var links   = menu.querySelectorAll('.menu-link');
  var buttons = document.querySelectorAll('.fx-btn');

  var mode = 'video';
  var dpr  = Math.min(window.devicePixelRatio || 1, 2);
  var W = 0, H = 0;
  var lines = []; // {text, x, y, fontSize}
  var rafId = null;

  // --- Сбор координат слов в системе меню ---
  function measure(){
    var mr = menu.getBoundingClientRect();
    W = Math.max(1, Math.round(mr.width));
    H = Math.max(1, Math.round(mr.height));

    canvas.width  = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';

    lines = [];
    links.forEach(function(link){
      var label = link.querySelector('.label');
      var text  = label.textContent || '';
      var lr    = label.getBoundingClientRect();
      var fontSize = parseFloat(getComputedStyle(link).fontSize) || 48;
      lines.push({
        text: text,
        x: lr.left - mr.left,
        y: lr.top  - mr.top,
        fontSize: fontSize
      });
    });
  }

  // --- Отрисовка кадра: видео + текст как «окно» ---
  function draw(){
    rafId = requestAnimationFrame(draw);
    if (mode !== 'video' || video.readyState < 2) return;

    ctx.setTransform(1,0,0,1,0,0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.setTransform(dpr,0,0,dpr,0,0);

    // 1. Рисуем видео на весь холст, object-fit: cover
    var vw = video.videoWidth  || 1;
    var vh = video.videoHeight || 1;
    var scale = Math.max(W / vw, H / vh);
    var dw = vw * scale;
    var dh = vh * scale;
    var dx = (W - dw) / 2;
    var dy = (H - dh) / 2;
    ctx.globalCompositeOperation = 'source-over';
    ctx.drawImage(video, dx, dy, dw, dh);

    // 2. Оставляем только пиксели, попавшие в текст (destination-in)
    ctx.globalCompositeOperation = 'destination-in';
    ctx.fillStyle = '#fff';
    ctx.textBaseline = 'top';

    lines.forEach(function(l){
      // ВАЖНО: тот же шрифт и размер, что и в меню
      ctx.font = '400 ' + l.fontSize + "px 'Yeseva One', serif";
      // Компенсация: getBoundingClientRect даёт верх глифа,
      // а fillText с textBaseline=top ставит по верхней линии шрифта.
      // Небольшая поправка по line-height, чтобы совпало с label.
      var lineHeight = l.fontSize * 1.05;
      var yOffset = (lineHeight - l.fontSize) * 0.5;
      ctx.fillText(l.text, l.x, l.y + yOffset);
    });

    ctx.globalCompositeOperation = 'source-over';
  }

  function start(){
    if (rafId == null) draw();
    video.play().catch(function(){});
    document.body.classList.add('media-on');
    layer.classList.add('ready');
  }

  function stop(){
    if (rafId != null){ cancelAnimationFrame(rafId); rafId = null; }
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    document.body.classList.remove('media-on');
    layer.classList.remove('ready');
  }

  // --- Переключатель ---
  buttons.forEach(function(b){
    b.addEventListener('click', function(){
      mode = b.getAttribute('data-mode');
      buttons.forEach(function(x){ x.classList.toggle('active', x === b); });
      if (mode === 'video'){
        if (video.readyState >= 2) start();
        else video.addEventListener('loadeddata', start, { once:true });
      } else {
        stop();
      }
    });
  });

  // --- Старт после загрузки видео и шрифта ---
  function boot(){
    measure();
    if (mode === 'video'){
      if (video.readyState >= 2) start();
      else {
        video.addEventListener('loadeddata', start, { once:true });
        video.addEventListener('error', function(){ stop(); }, { once:true });
      }
    }
  }

  if (document.fonts && document.fonts.ready){
    document.fonts.ready.then(boot);
  } else {
    boot();
  }

  // --- Ресайз ---
  var rt;
  window.addEventListener('resize', function(){
    clearTimeout(rt);
    rt = setTimeout(function(){
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      measure();
    }, 150);
  });
})();
</script>
</body>
</html>
