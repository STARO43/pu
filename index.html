<script>
/* ============================================================
   ЛОГИКА МЕНЮ
   Десктоп (точный указатель + hover): двойной клик — toggle.
   Мобильные / планшеты (грубый указатель ИЛИ нет hover): одиночный тап — toggle.
   Свайпы отключены полностью.
   ============================================================ */
(function(){
  var isMenuOpen = false;

  function setMenu(open){
    if (isMenuOpen === open) return;
    isMenuOpen = open;
    document.body.classList.toggle('is-menu', open);
  }
  window.__setMenu = setMenu;

  var coarse = window.matchMedia('(hover: none), (pointer: coarse)').matches;

  if (coarse) {
    /* --- МОБИЛЬНЫЕ И ПЛАНШЕТЫ: одиночный тап --- */
    var TAP_MAX_MOVE   = 12;   // px
    var TAP_MAX_TIME   = 600;  // ms
    var tapStartX = 0, tapStartY = 0, tapStartT = 0, tapTracking = false;

    window.addEventListener('touchstart', function(e){
      if (e.touches.length !== 1) { tapTracking = false; return; }
      if (e.target.closest('a, button')) { tapTracking = false; return; }
      var t = e.touches[0];
      tapStartX = t.clientX; tapStartY = t.clientY; tapStartT = performance.now();
      tapTracking = true;
    }, { passive: true });

    window.addEventListener('touchmove', function(e){
      if (!tapTracking) return;
      if (e.touches.length !== 1) { tapTracking = false; return; }
      var t = e.touches[0];
      var dx = t.clientX - tapStartX;
      var dy = t.clientY - tapStartY;
      if (dx*dx + dy*dy > TAP_MAX_MOVE * TAP_MAX_MOVE) {
        tapTracking = false;
      }
    }, { passive: true });

    window.addEventListener('touchend', function(e){
      if (!tapTracking) return;
      tapTracking = false;
      if (performance.now() - tapStartT > TAP_MAX_TIME) return;
      if (e.target.closest('a, button')) return;
      setMenu(!isMenuOpen);
    }, { passive: true });

    window.addEventListener('touchcancel', function(){ tapTracking = false; }, { passive: true });
  } else {
    /* --- ДЕСКТОП: двойной клик --- */
    window.addEventListener('dblclick', function(e){
      if (e.target.closest('a')) return;
      setMenu(!isMenuOpen);
    });
  }

  /* Моргание + переход по ссылке */
  var lids = document.querySelectorAll('.blink-lid');
  var links = document.querySelectorAll('.menu-link');
  links.forEach(function(link){
    link.addEventListener('click', function(e){
      e.preventDefault();
      var href = link.getAttribute('href');
      lids[0].style.transition = 'transform 0.35s ease-in';
      lids[1].style.transition = 'transform 0.35s ease-in';
      lids[0].style.transform = 'scaleY(1)';
      lids[1].style.transform = 'scaleY(1)';
      setTimeout(function(){ window.location.href = href; }, 380);
    });
  });
})();
</script>

<script>
/* ============================================================
   ВИДЕО ВНУТРИ БУКВ
   Маска строится на canvas из реального текста (тем же шрифтом,
   тем же кеглем и с той же базовой линией), поэтому видео
   идеально «ложится» в буквы.
   ============================================================ */
(function(){
  'use strict';

  var links = Array.prototype.slice.call(document.querySelectorAll('.menu-link'));
  if (!links.length) return;

  var DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  var FALLBACK_FONT = '"Yeseva One", Georgia, serif';

  var videos = [];
  var videoInited = false;

  /* ---------- построение маски ---------- */
  function buildMask(link){
    var textEl = link.querySelector('.menu-link__text');
    var marker = link.querySelector('.bl');
    var frame  = link.querySelector('.menu-link__video');
    if (!textEl || !frame) return;

    var fr = frame.getBoundingClientRect();
    var W  = Math.round(fr.width);
    var H  = Math.round(fr.height);
    if (W < 4 || H < 4) return;

    var cs = window.getComputedStyle(textEl);
    var fs = parseFloat(cs.fontSize) || 64;
    var ff = cs.fontFamily || FALLBACK_FONT;

    var lsRaw = cs.letterSpacing;
    var lsVal = (lsRaw && lsRaw !== 'normal') ? (parseFloat(lsRaw) || 0) : 0;

    var text = (textEl.textContent || '').replace(/\s+/g, ' ').trim();
    if (!text) return;

    var cv  = document.createElement('canvas');
    cv.width  = Math.max(1, Math.round(W * DPR));
    cv.height = Math.max(1, Math.round(H * DPR));

    var ctx = cv.getContext('2d');
    ctx.clearRect(0, 0, cv.width, cv.height);
    ctx.font = (fs * DPR) + 'px ' + ff;
    if (lsVal && ('letterSpacing' in ctx)) {
      ctx.letterSpacing = (lsVal * DPR) + 'px';
    }
    ctx.textAlign    = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle    = '#ffffff';

    /* координаты текста относительно рамки видео */
    var x = 0;
    var y = fs * 0.8;
    if (marker) {
      var mr = marker.getBoundingClientRect();
      x = mr.left - fr.left;
      y = mr.bottom - fr.top;
    }

    ctx.fillText(text, x * DPR, y * DPR);

    var url = 'url("' + cv.toDataURL('image/png') + '")';

    frame.style.webkitMaskImage    = url;
    frame.style.maskImage          = url;
    frame.style.webkitMaskRepeat   = 'no-repeat';
    frame.style.maskRepeat         = 'no-repeat';
    frame.style.webkitMaskSize     = '100% 100%';
    frame.style.maskSize           = '100% 100%';
    frame.style.webkitMaskPosition = '0 0';
    frame.style.maskPosition       = '0 0';
  }

  /* ---------- готовность видео ---------- */
  function hasMask(frame){
    return !!(frame.style.maskImage || frame.style.webkitMaskImage);
  }

  function initVideo(link){
    var frame = link.querySelector('.menu-link__video');
    var video = link.querySelector('video');
    if (!frame || !video) return;

    videos.push(video);

    function markReady(){
      if (link.classList.contains('is-ready')) return;
      if (!hasMask(frame)) return;
      link.classList.add('is-ready');
    }

    video.addEventListener('loadeddata', markReady);
    video.addEventListener('canplay',    markReady);
    video.addEventListener('playing',    markReady);

    video.addEventListener('error', function(){
      link.classList.remove('is-ready');
    });

    if (video.readyState >= 2) markReady();
  }

  /* ---------- воспроизведение ---------- */
  function syncPlayback(){
    var open = document.body.classList.contains('is-menu');
    var hidden = document.hidden;

    for (var i = 0; i < videos.length; i++){
      var v = videos[i];
      if (open && !hidden){
        if (v.paused){
          var p = v.play();
          if (p && typeof p.catch === 'function') p.catch(function(){});
        }
      } else {
        if (!v.paused) v.pause();
      }
    }
  }

  /* ---------- запуск ---------- */
  function boot(){
    requestAnimationFrame(function(){
      for (var i = 0; i < links.length; i++) buildMask(links[i]);

      if (!videoInited){
        videoInited = true;
        for (var j = 0; j < links.length; j++) initVideo(links[j]);
      }
      syncPlayback();
    });
  }

  if (document.fonts && document.fonts.ready){
    /* сначала гарантируем, что нужный шрифт загружен */
    try { document.fonts.load('100px "Yeseva One"'); } catch(e){}
    document.fonts.ready.then(boot, boot);
    setTimeout(boot, 1400); /* страховка */
  } else {
    boot();
  }

  /* пересборка масок при изменении размеров (кегль зависит от vw) */
  var rT = null;
  window.addEventListener('resize', function(){
    if (rT) clearTimeout(rT);
    rT = setTimeout(function(){
      for (var i = 0; i < links.length; i++) buildMask(links[i]);
    }, 160);
  }, { passive: true });

  /* следим за открытием меню — запускаем/останавливаем видео */
  var lastMenuState = null;
  function checkMenu(){
    var open = document.body.classList.contains('is-menu');
    if (open !== lastMenuState){
      lastMenuState = open;
      syncPlayback();
    }
  }
  if (window.MutationObserver){
    new MutationObserver(checkMenu).observe(document.body, {
      attributes: true, attributeFilter: ['class']
    });
  }
  setInterval(checkMenu, 600);

  document.addEventListener('visibilitychange', syncPlayback);

  /* первый жест — страховка для автоплея на iOS */
  var kick = function(){
    syncPlayback();
    window.removeEventListener('touchstart', kick);
    window.removeEventListener('pointerdown', kick);
  };
  window.addEventListener('touchstart', kick, { passive: true });
  window.addEventListener('pointerdown', kick, { passive: true });
})();
</script>

uniform vec2  uEyeUV;

float hash1(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float noise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  vec2 u = f*f*(3.0 - 2.0*f);
  return mix(mix(hash1(i), hash1(i+vec2(1,0)), u.x),
             mix(hash1(i+vec2(0,1)), hash1(i+vec2(1,1)), u.x), u.y);
}
float fbm(vec2 p) {
  float v = 0.0, a = 0.5;
  for (int i = 0; i < 5; i++) { v += a * noise(p); p = p * 2.02 + 13.7; a *= 0.5; }
  return v;
}

void main() {
  float sa = uRes.x / uRes.y;
  float ia = max(uImg.x / uImg.y, 0.0001);
  float t  = uTime;
  float zs = uZoom;

  vec2 p = vec2((vUv.x - 0.5) * sa, vUv.y - 0.5);

  float parFade = 1.0 - zs;
  p.x += uParallax.x * 0.018 * parFade;
  p.y += uParallax.y * 0.014 * parFade;

  float breath = 1.0 + sin(t * 0.40) * 0.0032 + sin(t * 0.17 + 1.2) * 0.0014;
  p /= breath;

  float k = max(1.0, sa / ia) * 1.10;
  vec2 uvBase = vec2(p.x / (ia * k) + 0.5, p.y / k + 0.5);
  uvBase.x -= 0.035;

  vec2  zc        = uEyeUV + vec2(-0.028, 0.004) * zs;
  float zoomScale = pow(38.0, zs);
  vec2  uv        = (uvBase - zc) / zoomScale + zc;
  vec2  uvSafe    = clamp(uv, vec2(0.001), vec2(0.999));

  vec3 col = texture2D(uMap, uvSafe).rgb;

  vec2 bgUV = uvSafe * uImg * 0.06;
  float surfaceNoise  = fbm(bgUV + vec2(t * 0.015));
  float surfaceNoise2 = fbm(bgUV * 3.0 - vec2(t * 0.02));
  float relief = (surfaceNoise - 0.5) * 0.45 + (surfaceNoise2 - 0.5) * 0.15;
  col = col * (1.0 + relief);

  col *= vec3(1.02, 0.98, 0.94);
  col *= 0.74;

  float flick = 0.82
    + sin(t * 2.7) * 0.045
    + sin(t * 6.9 + 1.3) * 0.038
    + sin(t * 12.4 + 2.7) * 0.028
    + (fbm(vec2(t * 2.2, 3.0)) - 0.5) * 0.15;

  vec2 firePos = vec2(sa * 0.50, -0.60);
  vec2 fd = p - firePos;
  float fireDist = dot(fd, fd);

  vec3 fireWarm = vec3(0.95, 0.36, 0.12);
  vec3 fireDeep = vec3(0.70, 0.16, 0.05);
  col += fireWarm * exp(-fireDist * 1.7) * flick * 0.090;
  col += fireDeep * exp(-fireDist * 3.4) * flick * 0.055;

  float fireMask = smoothstep(0.0, 0.55, exp(-fireDist * 2.0) * flick);
  col *= mix(vec3(1.0), vec3(1.06, 0.86, 0.68), fireMask * 0.55);

  float reflFire = exp(-fireDist * 1.5) * flick * 0.045;
  col += vec3(1.0, 0.55, 0.28) * reflFire;

  float cornerGlow = exp(-fireDist * 8.0) * flick;
  col += vec3(1.0, 0.45, 0.15) * cornerGlow * 0.35;

  float candle =
      1.0
    + sin(t * 7.3) * 0.018
    + sin(t * 13.1 + 1.7) * 0.012
    + sin(t * 3.3 + 0.5) * 0.008
    + (fbm(vec2(t * 1.7, 7.0)) - 0.5) * 0.040;
  col *= candle;
  col *= mix(vec3(1.0), vec3(1.035, 0.995, 0.945), (candle - 1.0) * 6.0 + 0.5);

  vec2 vc = p * vec2(0.85, 0.72);
  float vd = length(vc);
  col *= 1.0 - smoothstep(0.45, 1.10, vd) * 0.55;

  float g = hash1(gl_FragCoord.xy + fract(t) * 137.0);
  col += (g - 0.5) * 0.020;

  vec2 eDiff = uv - uEyeUV;
  float eDist = dot(eDiff, eDiff);
  float eyeGlow = exp(-eDist * 55.0) * sin(zs * 3.14159265);
  col += vec3(1.0, 0.74, 0.46) * eyeGlow * 0.38;

  float halo = exp(-eDist * 6.0) * sin(zs * 3.14159265) * 0.10;
  col += vec3(1.0, 0.55, 0.28) * halo;

  col = mix(col, col * vec3(1.06, 0.94, 0.84), zs * 0.55);

  float blackOut = smoothstep(0.72, 1.0, zs);
  col *= (1.0 - blackOut);

  col *= mix(0.35, 1.0, uReveal);

  gl_FragColor = vec4(col, uReveal);
}
`;

  const uniforms = {
    uMap:      { value: null },
    uRes:      { value: new THREE.Vector2(1, 1) },
    uImg:      { value: new THREE.Vector2(1, 1) },
    uTime:     { value: 0 },
    uReveal:   { value: 0 },
    uParallax: { value: new THREE.Vector2(0, 0) },
    uZoom:     { value: 0 },
    uEyeUV:    { value: new THREE.Vector2(0.34, 0.57) }
  };

  const material = new THREE.ShaderMaterial({
    uniforms, vertexShader, fragmentShader,
    transparent: true, depthWrite: false, depthTest: false
  });

  const plane = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), material);
  plane.frustumCulled = false;
  scene.add(plane);

  const phTex = new THREE.DataTexture(new Uint8Array([20, 16, 12, 255]), 1, 1, THREE.RGBAFormat);
  phTex.needsUpdate = true;
  uniforms.uMap.value = phTex;

  let composer = null;
  let finalPass = null;

  if (HAS_IMPORTMAP && EffectComposer && RenderPass && ShaderPass) {
    composer = new EffectComposer(renderer);
    composer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    composer.addPass(new RenderPass(scene, camera));

    finalPass = new ShaderPass({
      uniforms: {
        tDiffuse: { value: null },
        uTime:    { value: 0 },
        uRes:     { value: new THREE.Vector2(1, 1) },
        uGrain:   { value: 0.016 }
      },
      vertexShader: `
varying vec2 vUv;
void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }
`,
      fragmentShader: `
precision highp float;
varying vec2 vUv;
uniform sampler2D tDiffuse;
uniform float uTime;
uniform vec2  uRes;
uniform float uGrain;
float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
void main(){
  vec3 col = texture2D(tDiffuse, vUv).rgb;
  vec2 t = vUv * uRes;
  float g1 = hash(t * 0.7 + fract(uTime * 8.0) * 100.0) - 0.5;
  float g2 = hash(t * 0.3 + fract(uTime * 5.0) * 100.0) - 0.5;
  float grain = g1 * 0.65 + g2 * 0.35;
  col += grain * uGrain;
  gl_FragColor = vec4(col, 1.0);
}
`
    });
    composer.addPass(finalPass);
  }

  function resize() {
    const w = host.clientWidth || window.innerWidth;
    const h = host.clientHeight || window.innerHeight;
    if (!w || !h) return;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    const vh = 2 * Math.tan(camera.fov * Math.PI / 360) * camera.position.z;
    const vw = vh * camera.aspect;
    plane.scale.set(vw, vh, 1);
    uniforms.uRes.value.set(w, h);
    if (composer) composer.setSize(w, h);
    if (finalPass) finalPass.uniforms.uRes.value.set(w, h);
  }

  const clock = new THREE.Clock();
  let elapsed = 0;
  let revealStart = -1;

  const parallaxTarget  = new THREE.Vector2(0, 0);
  const parallaxCurrent = new THREE.Vector2(0, 0);

  new THREE.TextureLoader().load('pushkin.jpg', (tex) => {
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.anisotropy = Math.min(16, renderer.capabilities.getMaxAnisotropy());
    tex.minFilter = THREE.LinearMipmapLinearFilter;
    tex.magFilter = THREE.LinearFilter;
    tex.generateMipmaps = true;
    if (uniforms.uMap.value && uniforms.uMap.value.dispose) uniforms.uMap.value.dispose();
    uniforms.uMap.value = tex;
    uniforms.uImg.value.set(tex.image.width || 1, tex.image.height || 1);
    resize();
    startReveal();
  }, undefined, () => {
    document.body.classList.add('gl-broken');
    startReveal();
  });

  function startReveal() {
    if (revealStart >= 0) return;
    revealStart = performance.now();
  }

  window.addEventListener('pointermove', (e) => {
    const cx = window.innerWidth / 2;
    const cy = window.innerHeight / 2;
    parallaxTarget.set((e.clientX - cx) / cx, (e.clientY - cy) / cy);
  }, { passive: true });

  let menuProgress = 0;
  let anim = null;
  let lastMenuOpen = false;

  function setMenuProgress(target, dur, easing) {
    anim = {
      from:  menuProgress,
      to:    target,
      start: performance.now(),
      dur:   dur,
      ease:  easing
    };
  }

  function tick() {
    requestAnimationFrame(tick);

    const dt = Math.min(0.05, clock.getDelta());
    elapsed += dt;

    uniforms.uTime.value = elapsed;

    const menuOpen = document.body.classList.contains('is-menu');
    if (menuOpen !== lastMenuOpen) {
      lastMenuOpen = menuOpen;
      if (menuOpen) {
        setMenuProgress(1, 1800, ease.inOutCubic);
      } else {
        setMenuProgress(0, 1500, ease.outCubic);
      }
    }

    if (anim) {
      const t = clamp((performance.now() - anim.start) / anim.dur, 0, 1);
      const e = anim.ease(t);
      menuProgress = anim.from + (anim.to - anim.from) * e;
      if (t >= 1) anim = null;
    }
    uniforms.uZoom.value = clamp(menuProgress, 0, 1);

    if (revealStart > 0) {
      const raw = (performance.now() - revealStart) / 2400;
      uniforms.uReveal.value = ease.expoOut(clamp(raw, 0, 1));
    }

    parallaxCurrent.lerp(parallaxTarget, Math.min(1, dt * 2.5));
    uniforms.uParallax.value.copy(parallaxCurrent);

    if (finalPass) finalPass.uniforms.uTime.value = elapsed;
    if (composer) composer.render();
    else renderer.render(scene, camera);
  }

  resize();
  if (window.ResizeObserver) new ResizeObserver(resize).observe(host);
  else window.addEventListener('resize', resize);

  requestAnimationFrame(tick);
}
</script>
</body>
</html>
